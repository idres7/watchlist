<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قائمتي</title><meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f12;--s1:#17181d;--s2:#1f2127;--ln:#2a2c34;--tx:#f2f1ee;--mu:#8b8d96;--ac:#7c9cff;--gold:#f5b942;--ok:#4cc38a;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:700;padding:18px 18px 4px}h2{font-size:17px;font-weight:600}
.sub{color:var(--mu);font-size:13px;padding:0 18px}
.sec{margin-top:26px}.sec>.hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px 10px}
.hd button{color:var(--ac);font-size:13px}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 112px}
.card{text-align:right;display:block;width:100%}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--s2);display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:600;line-height:1.4;color:var(--mu)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pill{position:absolute;top:6px;inset-inline-start:6px;background:rgba(14,15,18,.82);border-radius:20px;padding:2px 7px;font-size:11px;font-weight:600;color:var(--gold)}
.dot{position:absolute;bottom:6px;inset-inline-end:6px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(14,15,18,.8)}
.ct{margin-top:6px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:11.5px;color:var(--mu);margin-top:1px}
.stats{margin:16px 18px 0;background:var(--s1);border-radius:var(--r);padding:16px}
.nums{display:flex;justify-content:space-between}.nums div{text-align:center;flex:1}
.nums b{display:block;font-size:24px;font-weight:700}.nums span{font-size:12px;color:var(--mu)}
.bar{height:6px;background:var(--s2);border-radius:6px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 18px 10px;border-bottom:1px solid var(--ln)}
.top h1{padding:0 0 10px;font-size:22px}
.search{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;outline:0}
.search:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:20px;background:var(--s1);color:var(--mu);font-size:13px;border:1px solid transparent}
.chip.on{background:var(--tx);color:var(--bg);font-weight:600}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center}
.seg{flex:1;display:flex;background:var(--s1);border-radius:10px;padding:3px}
.seg button{flex:1;padding:6px 0;border-radius:8px;font-size:12.5px;color:var(--mu)}.seg .on{background:var(--s2);color:var(--tx);font-weight:600}
select{background:var(--s1);border:0;border-radius:10px;padding:8px 10px;font-size:12.5px;outline:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:16px 18px}
.count{padding:12px 18px 0;color:var(--mu);font-size:12.5px}
.more{display:block;margin:4px auto 20px;padding:10px 24px;border-radius:20px;background:var(--s1)}
.empty{text-align:center;color:var(--mu);padding:60px 30px}
nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;display:flex;background:rgba(23,24,29,.94);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--tx)}
.fab{background:var(--ac)!important;color:#0e0f12!important;border-radius:50%;width:46px;height:46px;flex:none!important;padding:0!important;justify-content:center;align-self:center;margin-top:-14px}
.fab svg{stroke-width:2.4}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}.veil.on{display:block}
.sheet{position:fixed;inset-inline:0;bottom:0;max-width:520px;margin:0 auto;background:var(--s1);border-radius:20px 20px 0 0;z-index:21;max-height:88vh;overflow:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}.grab{width:38px;height:4px;border-radius:4px;background:var(--ln);margin:0 auto 14px}
.dh{display:flex;gap:14px}.dh .poster{width:96px;flex:none}.dh h2{font-size:18px;line-height:1.4}
.dh p{color:var(--mu);font-size:13px;margin-top:6px}
.lbl{font-size:12.5px;color:var(--mu);margin:18px 0 8px}
.stars{display:flex;gap:6px}.stars button{font-size:26px;color:var(--ln)}.stars .on{color:var(--gold)}
textarea,.in{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;outline:0}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--ac);color:#0e0f12;font-weight:600;margin-top:18px}
.del{color:#ff7a7a;display:block;margin:14px auto 0;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
html,body{overflow-x:clip}#app{width:100%;overflow-x:clip}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-width:0;overflow:hidden}.row .card{flex:0 0 112px;width:112px}
.ct,.cm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}nav{left:0;right:0;width:100%}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}.li button{font-size:13px;color:var(--ac)}
.lst{margin:14px 18px 0;background:var(--s1);border-radius:var(--r);padding:0 16px}.lst .li{width:100%;text-align:right;padding:15px 0}.lst .li:last-child{border:0}
.sw{display:flex;gap:12px;padding:4px 18px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%}
.rw{display:flex;gap:12px;align-items:center;padding:10px;background:var(--s2);border-radius:10px;margin-bottom:6px}.rw .ct{margin:0;flex:1}
.hdl{touch-action:none;font-size:20px;color:var(--mu);padding:2px 8px}.rw.drag{outline:1px solid var(--ac)}.sheet .grid{padding:12px 0}
.cover{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px;border:1px dashed var(--ln);border-radius:12px;color:var(--mu);text-align:right}.cover img{width:44px;height:64px;object-fit:cover;border-radius:6px}
.gp{position:absolute;bottom:0;inset-inline-start:0;height:4px;background:var(--ok)}.gr{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--ln)}
.lk{color:#4da3ff;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
</style></head><body>

<nav id="nav"></nav><div class="veil" id="veil"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>

const nz=s=>(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N}]+/gu,"");
function sim(a,b){a=nz(a);b=nz(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return Math.min(a.length,b.length)/Math.max(a.length,b.length)>.5?.9:.6;const bg=s=>{const m={};for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m[g]=(m[g]||0)+1}return m},x=bg(a),y=bg(b);let o=0,t=0,u=0;for(const g in x){t+=x[g];if(y[g])o+=Math.min(x[g],y[g])}for(const g in y)u+=y[g];return 2*o/((t+u)||1)}
function dupGroups(){const m=new Map(),out=[];items.forEach(i=>{const k=nz(i.name).replace(/^the/,"")||"#"+i.id;(m.get(k)||m.set(k,[]).get(k)).push(i)});
 m.forEach(l=>{if(l.length<2)return;const by={};l.forEach(i=>(by[i.year||0]??=[]).push(i));const ys=Object.keys(by).filter(y=>y!=="0");if(by[0]&&ys.length===1){by[ys[0]].push(...by[0]);delete by[0]}Object.values(by).forEach(g=>{if(g.length>1)out.push(g)})});
 const t=new Map();items.forEach(i=>{if(i.tm){const k=i.tm.mt+i.tm.id;(t.get(k)||t.set(k,[]).get(k)).push(i)}});t.forEach(g=>{if(g.length>1&&!out.some(o=>g.every(x=>o.includes(x))))out.push(g)});return out}
const RK={unwatched:0,watching:1,watched:2},score=m=>RK[m.status]*4+(m.note?2:0)+(m.myRating?1:0)+(m.image?1:0)+(m.tm?1:0)+(m.year?.5:0)+(m.imdb?.5:0);
function mergeKeep(keepId,ids){const k=items.find(x=>x.id==keepId);ids.filter(id=>id!=keepId).forEach(id=>{const o=items.find(x=>x.id==id);if(!o)return;if(RK[o.status]>RK[k.status])k.status=o.status;k.myRating=Math.max(k.myRating||0,o.myRating||0);if(o.note&&!(k.note||"").includes(o.note))k.note=((k.note||"")+" "+o.note).trim();["image","year","imdb","tm","country"].forEach(f=>{if(!k[f]&&o[f])k[f]=o[f]});toTrash(o.id)})}

async function tmData(r,mt){const d=await tm(`/${mt}/${r.id}?language=en-US&append_to_response=external_ids`),ar=d.original_language==="ar",dt=d.release_date||d.first_air_date||"";let imdb=+(d.vote_average||0).toFixed(1);const iid=(d.external_ids||{}).imdb_id||d.imdb_id;if(iid){try{const o=await(await omf("i="+iid)).json();if(o.imdbRating&&o.imdbRating!=="N/A")imdb=parseFloat(o.imdbRating)}catch(e){}}const oc=(d.origin_country||[])[0]||((d.production_countries||[])[0]||{}).iso_3166_1;return{name:ar?(d.original_title||d.original_name):(d.title||d.name),type:tmType(d,mt),country:tmC(oc,d.original_language),year:+dt.slice(0,4)||null,imdb:imdb||0,image:d.poster_path?TI+d.poster_path:"",tm:{id:d.id,mt}}}

async function runVerify(){if(VBUSY)return;const todo=items.filter(i=>!i.chk);if(!todo.length)return toast("كل الأعمال انفحصت");VBUSY=true;REV=[];let n=0,ok=0,er=0;const st=t=>{const e=$("#vp");if(e)e.textContent=t};

/* stats + upcoming */
let UP=LS("wl_up",{}),UPBUSY=false;
const dayDiff=s=>{const a=new Date(s+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)};
const dayTxt=n=>n===0?"اليوم":n===1?"بكرة":n===2?"بعد يومين":"بعد "+n+" يوم";
async function upRefresh(){if(UPBUSY)return;UPBUSY=true;const now=Date.now(),todo=items.filter(i=>i.tm&&i.tm.mt==="tv"&&i.status!=="unwatched"&&(!UP[i.id]||now-UP[i.id].t>432e5)).slice(0,60);let ch=0;
 for(const i of todo){try{const d=await tm("/tv/"+i.tm.id+"?language=en-US"),n=d.next_episode_to_air;UP[i.id]={t:now,n:n&&n.air_date?{d:n.air_date,s:n.season_number,e:n.episode_number}:null};ch++}catch(e){}await new Promise(r=>setTimeout(r,80))}
 put("wl_up",UP);UPBUSY=false;if(ch&&S.tab==="home")home()}
function upSec(){const l=items.filter(i=>UP[i.id]&&UP[i.id].n&&dayDiff(UP[i.id].n.d)>=0&&dayDiff(UP[i.id].n.d)<=90).sort((a,b)=>UP[a.id].n.d.localeCompare(UP[b.id].n.d));if(!l.length)return"";
 return`<div class="sec"><div class="hd"><h2>📅 حلقات قادمة</h2></div><div class="row">${l.slice(0,15).map(i=>{const n=UP[i.id].n;return`<button class="card" data-id="${i.id}"><div class="poster">${E(i.name)}${i.image?`<img loading="lazy" src="${E(i.image)}" onerror="this.remove()" alt="">`:""}<span class="pill" style="color:var(--tx)">${dayTxt(dayDiff(n.d))}</span></div><div class="ct">${E(i.name)}</div><div class="cm">م${n.s} • ح${n.e}</div></button>`}).join("")}</div></div>`}
function statsSheet(){const W=items.filter(i=>i.status==="watched"),G=items.filter(i=>i.status==="watching"),n=items.length||1,d=new Date(),ms=new Date(d.getFullYear(),d.getMonth(),1).getTime(),ys=new Date(d.getFullYear(),0,1).getTime();
 const mo=W.filter(i=>i.watchedAt>=ms).length,yy=W.filter(i=>i.watchedAt>=ys).length,rt=W.filter(i=>i.myRating>0),im=W.filter(i=>i.imdb>0);
 const avg=rt.length?(rt.reduce((a,i)=>a+i.myRating,0)/rt.length).toFixed(1):"—",aim=im.length?(im.reduce((a,i)=>a+i.imdb,0)/im.length).toFixed(1):"—";
 const bar=(l,p,t)=>`<div class="gr" style="gap:10px"><span style="width:92px;font-size:13px">${l}</span><div class="bar" style="flex:1;margin:0"><i style="width:${p}%"></i></div><span class="cm" style="width:46px;text-align:left">${t}</span></div>`;
 const cc={};W.forEach(i=>cc[i.country]=(cc[i.country]||0)+1);const tc=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=tc[0]?tc[0][1]:1;
 const fav=rt.filter(i=>i.myRating>=4).sort((a,b)=>b.myRating-a.myRating||(b.imdb||0)-(a.imdb||0)).slice(0,5);
 const row=(l,v)=>`<div class="li"><span>${l}</span><span class="cm">${v}</span></div>`;
 sheet(`<h2>إحصائياتي</h2><div class="stats" style="margin:12px 0 0"><div class="nums"><div><b>${W.length}</b><span>شاهدت</span></div><div><b>${G.length}</b><span>جاري</span></div><div><b>${items.length-W.length-G.length}</b><span>بالانتظار</span></div></div><div class="bar"><i style="width:${Math.round(W.length/n*100)}%"></i></div></div>
 <div class="lst" style="margin:12px 0 0">${row("شاهدت هذا الشهر",mo)}${row("شاهدت هذه السنة",yy)}${row("متوسط تقييمي",avg+" ★")}${row("متوسط IMDb لما شاهدته",aim)}</div>
 <div class="lbl">حسب النوع (شاهدت / الكل)</div>${TYPES.map(([k,l])=>{const t=items.filter(i=>i.type===k).length,w=W.filter(i=>i.type===k).length;return bar(l,t?Math.round(w/t*100):0,w+"/"+t)}).join("")}
 ${tc.length?`<div class="lbl">أكثر البلدان مشاهدة</div>${tc.map(([c,v])=>bar(flag(c)+" "+((COUNTRIES.find(x=>x.code===c)||{}).label||c),Math.round(v/mx*100),v)).join("")}`:""}
 ${fav.length?`<div class="lbl">أفضل أعمالك</div>${fav.map(i=>`<div class="li"><span class="ct">${E(i.name)}</span><span style="color:var(--gold)">${"★".repeat(i.myRating)}</span></div>`).join("")}`:""}
 <p class="sub" style="padding:14px 0 0;font-size:11.5px">عدّاد الشهر والسنة يحسب من تاريخ تعليم العمل كمشاهد، فيبدأ من هسه للأعمال القديمة.</p>`)}

/* guide links */
let GBACK=null;
function linkRe(){const m=new Map();items.forEach(i=>{const n=(i.name||"").trim();if(n.length<3)return;const k=nz(n);if(k&&!m.has(k))m.set(k,{n,id:i.id})});
 const esc=s=>s.split(/[^\p{L}\p{N}]+/u).filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[^\\p{L}\\p{N}]+");
 const names=[...m.values()].map(v=>v.n).sort((a,b)=>b.length-a.length).map(esc).filter(Boolean);
 return{re:names.length?new RegExp("(?<![\\p{L}\\p{N}])(?:"+names.join("|")+")(?![\\p{L}\\p{N}])","giu"):null,m}}
function linkify(txt){const{re,m}=linkRe();if(!re)return E(txt);let out="",last=0,r;re.lastIndex=0;
 while((r=re.exec(txt))){if(!r[0].length){re.lastIndex++;continue}out+=E(txt.slice(last,r.index));const v=m.get(nz(r[0]));out+=v?`<a class="lk" data-x="g_link" data-k="${v.id}">${E(r[0])}</a>`:E(r[0]);last=r.index+r[0].length}
 return out+E(txt.slice(last))}
let GCUR=null;
Object.assign(X,{g_link:k=>{GBACK=GCUR;detail(k)},g_back:()=>{if(GBACK)guideView(GBACK)}});
