<style>
:root{--bg:#0e0f12;--s1:#17181d;--s2:#1f2127;--ln:#2a2c34;--tx:#f2f1ee;--mu:#8b8d96;--ac:#7c9cff;--gold:#f5b942;--ok:#4cc38a;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:700;padding:18px 18px 4px}h2{font-size:17px;font-weight:600}
.sub{color:var(--mu);font-size:13px;padding:0 18px}
.sec{margin-top:26px}.sec>.hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px 10px}
.hd button{color:var(--ac);font-size:13px}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 112px}
.card{text-align:right;display:block;width:100%}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--s2);display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:600;line-height:1.4;color:var(--mu)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pill{position:absolute;top:6px;inset-inline-start:6px;background:rgba(14,15,18,.82);border-radius:20px;padding:2px 7px;font-size:11px;font-weight:600;color:var(--gold)}
.dot{position:absolute;bottom:6px;inset-inline-end:6px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(14,15,18,.8)}
.ct{margin-top:6px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:11.5px;color:var(--mu);margin-top:1px}
.stats{margin:16px 18px 0;background:var(--s1);border-radius:var(--r);padding:16px}
.nums{display:flex;justify-content:space-between}.nums div{text-align:center;flex:1}
.nums b{display:block;font-size:24px;font-weight:700}.nums span{font-size:12px;color:var(--mu)}
.bar{height:6px;background:var(--s2);border-radius:6px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 18px 10px;border-bottom:1px solid var(--ln)}
.top h1{padding:0 0 10px;font-size:22px}
.search{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;outline:0}
.search:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:20px;background:var(--s1);color:var(--mu);font-size:13px;border:1px solid transparent}
.chip.on{background:var(--tx);color:var(--bg);font-weight:600}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center}
.seg{flex:1;display:flex;background:var(--s1);border-radius:10px;padding:3px}
.seg button{flex:1;padding:6px 0;border-radius:8px;font-size:12.5px;color:var(--mu)}.seg .on{background:var(--s2);color:var(--tx);font-weight:600}
select{background:var(--s1);border:0;border-radius:10px;padding:8px 10px;font-size:12.5px;outline:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:16px 18px}
.count{padding:12px 18px 0;color:var(--mu);font-size:12.5px}
.more{display:block;margin:4px auto 20px;padding:10px 24px;border-radius:20px;background:var(--s1)}
.empty{text-align:center;color:var(--mu);padding:60px 30px}
nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;display:flex;background:rgba(23,24,29,.94);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--tx)}
.fab{background:var(--ac)!important;color:#0e0f12!important;border-radius:50%;width:46px;height:46px;flex:none!important;padding:0!important;justify-content:center;align-self:center;margin-top:-14px}
.fab svg{stroke-width:2.4}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}.veil.on{display:block}
.sheet{position:fixed;inset-inline:0;bottom:0;max-width:520px;margin:0 auto;background:var(--s1);border-radius:20px 20px 0 0;z-index:21;max-height:88vh;overflow:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}.grab{width:38px;height:4px;border-radius:4px;background:var(--ln);margin:0 auto 14px}
.dh{display:flex;gap:14px}.dh .poster{width:96px;flex:none}.dh h2{font-size:18px;line-height:1.4}
.dh p{color:var(--mu);font-size:13px;margin-top:6px}
.lbl{font-size:12.5px;color:var(--mu);margin:18px 0 8px}
.stars{display:flex;gap:6px}.stars button{font-size:26px;color:var(--ln)}.stars .on{color:var(--gold)}
textarea,.in{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;outline:0}
textarea{min-height:70px;resize:vertical}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--ac);color:#0e0f12;font-weight:600;margin-top:18px}
.del{color:#ff7a7a;display:block;margin:14px auto 0;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
html,body{overflow-x:clip}#app{width:100%;overflow-x:clip}
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-width:0;overflow:hidden}.row .card{flex:0 0 112px;width:112px}

.lk{color:#4da3ff;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sw{position:relative}.sw .search{padding-inline-end:82px}.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}.lkb{width:min(320px,86%);text-align:center}.sx{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--s2);color:var(--tx);font-size:13px;display:flex;align-items:center;justify-content:center}.sx[hidden]{display:none}.tools{flex-wrap:wrap}.tools .seg{flex:1 1 100%}.tools select,.tools .cbtn{flex:1;min-width:0}.cbtn{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font-size:13px}.cbtn.on{background:var(--tx);color:var(--bg);font-weight:600}

 sheet(`<h2>${E(o.name)}</h2><div class="sub">${w}/${m.length} مشاهد</div><div style="height:6px;background:var(--s2);border-radius:6px;margin:8px 0 12px"><div style="height:100%;width:${m.length?w/m.length*100:0}%;background:#4cc38a;border-radius:6px"></div></div>${m.map((i,n)=>`<div class="gr">${thumb(i)}<span style="flex:1;min-width:0"><b class="ct" style="display:block;font-size:14px">${n+1}. ${E(i.name)}</b><span class="cm">${i.year||""}</span></span><button data-x="od_st" data-k="${i.id}" ${bs}>${SI[i.status]}</button><button data-x="od_up" data-k="${i.id}" ${bs}>▲</button><button data-x="od_dn" data-k="${i.id}" ${bs}>▼</button><button data-x="od_to" data-k="${i.id}" ${bs}>#</button><button data-x="od_rm" data-k="${i.id}" style="padding:4px 7px;font-size:15px;color:#ff7a7a">✕</button></div>`).join("")||'<div class="empty">القائمة فارغة، أضف أعمال</div>'}<div class="two" style="margin-top:12px"><button class="chip" data-x="od_add">＋ أضف عمل</button><button class="chip" data-x="od_next">⏭ التالي</button></div><div class="two" style="margin-top:8px"><button class="chip" data-x="od_ren">✏️ تسمية</button><button class="chip" data-x="od_del" style="color:#ff7a7a">🗑️ حذف القائمة</button></div><button class="btn" data-x="od_back" style="margin-top:8px;background:var(--s2);color:var(--tx)">رجوع</button>`)}
function odFind(v){const o=ORDS.find(x=>x.id===OCUR),q=sn(v.trim()),b=$("#od_r");if(!o||!b)return;b.innerHTML=q?(items.filter(i=>!o.ids.includes(i.id)&&sn(i.name).includes(q)).slice(0,8).map(i=>`<button class="li" data-x="od_pick" data-k="${i.id}" style="width:100%"><span>${E(i.name)}</span><span class="cm">${i.year||""}</span></button>`).join("")||'<div class="empty">ما كو نتائج</div>'):""}
function odMove(id,to){const o=ORDS.find(x=>x.id===OCUR);if(!o)return;const p=o.ids.indexOf(id);if(p<0)return;o.ids.splice(p,1);o.ids.splice(Math.max(0,Math.min(o.ids.length,to)),0,id);ordSave();odView(OCUR)}
Object.assign(X,{m_ords:ordsSheet,od_open:k=>odView(+k),od_back:ordsSheet,
 od_new:()=>{const n=(prompt("اسم الترتيب (مثلاً: ترتيب مشاهدة Marvel)")||"").trim();if(!n)return;const o={id:Date.now(),name:n,ids:[]};ORDS.push(o);ordSave();odView(o.id)},
 od_ren:()=>{const o=ORDS.find(x=>x.id===OCUR),n=(prompt("الاسم الجديد",o.name)||"").trim();if(n){o.name=n;ordSave();odView(OCUR)}},
 od_del:()=>{if(!confirm("حذف هذي القائمة؟ (الأعمال نفسها تبقى بمكتبتك)"))return;ORDS=ORDS.filter(x=>x.id!==OCUR);ordSave();ordsSheet()},
 od_add:()=>{sheet(`<h2>＋ أضف للترتيب</h2><input class="in" id="od_q" placeholder="ابحث عن عمل من مكتبتك..."><div id="od_r" class="lst"></div><button class="btn" data-x="od_done" style="margin-top:10px">تم</button>`);const q=$("#od_q");if(q)q.focus()},
 od_pick:k=>{const o=ORDS.find(x=>x.id===OCUR);if(!o)return;o.ids.push(+k);ordSave();toast("انضاف بالآخر (رقم "+o.ids.length+")");odFind($("#od_q").value)},od_done:()=>odView(OCUR),
 od_st:k=>{snap("تغيّرت الحالة");const i=items.find(x=>x.id==k);i.status={unwatched:"watching",watching:"watched",watched:"unwatched",dropped:"unwatched"}[i.status];if(i.status==="watched"&&!i.watchedAt)i.watchedAt=Date.now();save();odView(OCUR)},
 od_up:k=>{const o=ORDS.find(x=>x.id===OCUR);odMove(+k,o.ids.indexOf(+k)-1)},od_dn:k=>{const o=ORDS.find(x=>x.id===OCUR);odMove(+k,o.ids.indexOf(+k)+1)},
 od_to:k=>{const o=ORDS.find(x=>x.id===OCUR),n=parseInt(prompt("رقم المكان الجديد (1 إلى "+o.ids.length+")"));if(n>=1)odMove(+k,n-1)},
 od_rm:k=>{const o=ORDS.find(x=>x.id===OCUR);o.ids=o.ids.filter(x=>x!==+k);ordSave();odView(OCUR)},
 od_next:()=>{const o=ORDS.find(x=>x.id===OCUR),n=odItems(o).find(i=>i.status==="watching"||i.status==="unwatched");n?detail(n.id):toast("خلصت كل القائمة 🎉")}});
/* reorder the More menu */
let MEDIT=false,MKEYS=[];
function moreSort(arr){let o=[];try{o=JSON.parse(localStorage.getItem("wl_more_order")||"[]")}catch(e){}const ix=k=>{const n=o.indexOf(k);return n<0?1e6+arr.findIndex(a=>a[0]===k):n};const r=[...arr].sort((a,b)=>ix(a[0])-ix(b[0]));MKEYS=r.map(a=>a[0]);return r}
Object.assign(X,{mo_edit:()=>{MEDIT=!MEDIT;more()},mo_m:v=>{const[k,op]=v.split("|"),a=MKEYS.slice(),p=a.indexOf(k);a.splice(p,1);let q={first:0,up:p-1,dn:p+1,mid:Math.floor((a.length+1)/2)}[op];q=Math.max(0,Math.min(a.length,q));a.splice(q,0,k);localStorage.setItem("wl_more_order",JSON.stringify(a));more()}});
/* sync backups, voice, lock */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("wl:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let HID=0;
function lockShow(){if(!localStorage.getItem("wl_pin")||$("#lk"))return;const d=document.createElement("div");d.id="lk";d.className="lock";d.innerHTML=`<div class="lkb"><div style="font-size:42px">🔒</div><div style="margin:10px 0">أدخل الرمز</div><input id="lk_i" type="password" inputmode="numeric" maxlength="8" class="in" style="text-align:center;letter-spacing:8px"><button class="btn" data-x="lk_ok" style="margin-top:12px">فتح</button><div id="lk_e" style="color:#ff7a7a;height:20px;margin-top:8px"></div></div>`;document.body.appendChild(d);setTimeout(()=>{const i=$("#lk_i");if(i)i.focus()},50)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)HID=Date.now();else if(HID&&Date.now()-HID>60000)lockShow()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="lk_i")X.lk_ok()});
setTimeout(lockShow,0);
Object.assign(X,{c_force:()=>cloudPush(false,true),
 c_bk:async()=>{try{const r=await srvFetch("/backups");if(!r.ok)throw new Error("("+r.status+") حدّث كود الـWorker أول");const l=await r.json();sheet(`<h2>🗂️ نسخ السيرفر السابقة</h2><div class="sub" style="margin:4px 0 10px">تنحفظ تلقائياً (مرة كل نص ساعة كحد أدنى) وآخر 30 بس</div>${l.length?`<div class="lst">${l.map(b=>`<button class="li" data-x="c_bkrest" data-k="${E(b.k)}" style="width:100%"><span>${new Date(b.t).toLocaleString("ar-IQ")}</span><span class="cm">استرجاع</span></button>`).join("")}</div>`:'<div class="empty">ما كو نسخ سابقة بعد</div>'}`)}catch(e){toast("فشل: "+e.message)}},
 c_bkrest:k=>cloudPull("/backup?k="+encodeURIComponent(k)),
 q_mic:()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast("المتصفح ما يدعم البحث الصوتي");const r=new R();r.lang="ar-IQ";r.interimResults=false;r.onresult=e=>{const v=e.results[0][0].transcript;S.q=v;S.lim=60;const q=$("#q");if(q)q.value=v;const x=$("#qx");if(x)x.hidden=false;fill()};r.onerror=e=>toast("ما اشتغل المايك: "+e.error);r.onend=()=>{const b=$("#qm");if(b)b.textContent="🎤"};const b=$("#qm");if(b)b.textContent="🔴";r.start()},
 lk_ok:async()=>{const i=$("#lk_i");if(!i)return;if(await sha(i.value)===localStorage.getItem("wl_pin")){$("#lk").remove()}else{$("#lk_e").textContent="الرمز غلط";i.value=""}},
 m_pin:async()=>{if(localStorage.getItem("wl_pin")){if(confirm("إلغاء قفل التطبيق؟")){localStorage.removeItem("wl_pin");toast("انلغى القفل");more()}return}const v=(prompt("اكتب رمز من 4 إلى 8 أرقام")||"").trim();if(!/^\d{4,8}$/.test(v))return v?toast("الرمز لازم أرقام فقط (4 إلى 8)"):0;localStorage.setItem("wl_pin",await sha(v));toast("تم تفعيل القفل");more()}});
/* anilist + update notice */
async function anilistScore(q){try{const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:"query($s:String){Media(search:$s,type:ANIME){averageScore}}",variables:{s:q}}),signal:AbortSignal.timeout?AbortSignal.timeout(4500):undefined}),j=await r.json();return j.data&&j.data.Media&&j.data.Media.averageScore}catch(e){return null}}
try{if(navigator.serviceWorker){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had)return;let b=$("#undo");if(!b){b=document.createElement("div");b.id="undo";b.className="undo";document.body.appendChild(b)}b.innerHTML='<span>🔄 صارت نسخة جديدة</span><button data-x="m_reload">حدّث</button>';b.classList.add("on")})}}catch(e){}
