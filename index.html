*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg,#0a0a0f);color:var(--fg,#f0f0f0);font-family:'Cairo',sans-serif;direction:rtl;min-height:100vh;background-image:radial-gradient(ellipse at 20% 20%,#1a0a2e 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,#0a1a2e 0%,transparent 50%);}

#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:75px;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,13,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:100;}

.nav-btn .icon{font-size:20px;}
.header{padding:14px 14px 8px;background:rgba(13,13,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:50;}

.form-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;color:#f0f0f0;font-family:'Cairo',sans-serif;font-size:14px;direction:rtl;outline:none;margin-bottom:10px;transition:border .2s;}

.stats-grid{display:flex;gap:8px;margin-bottom:10px;}

window.cloudPull=async function(){
  if(!CLOUD_BIN){showToast("ما فيه نسخة سحابية محفوظة بعد ☁️","var(--accent-hex)");return;}
  CLOUD_BUSY=true;

    const r=await fetch("https://api.jsonbin.io/v3/b/"+CLOUD_BIN+"/latest",{headers:{"X-Master-Key":CLOUD_KEY}});
    if(!r.ok){const t=await r.text().catch(()=>"");throw new Error("("+r.status+") "+t.slice(0,100));}

    let rec=d.record;
    if(rec&&rec.c===1&&rec.data){
      if(typeof LZString==="undefined")throw new Error("مكتبة فك الضغط ما تحملت — تأكد من الإنترنت");

    CLOUD_MODAL=false;

    CLOUD_LAST_ERROR=e.message||String(e);
    renderPage();

// A few well-known franchises whose titles don't share a common machine-detectable prefix
// (e.g. "Harry Potter and the X" has a different subtitle per film, no colon to split on)
const FRANCHISE_OVERRIDES=[
  {key:"Harry Potter",test:n=>/^Harry Potter/i.test(n)},
  {key:"Fantastic Beasts",test:n=>/^Fantastic Beasts/i.test(n)},
];
function franchiseBase(name){
  for(const f of FRANCHISE_OVERRIDES){
    if(f.test(name))return f.key;
  }
  let b=name.split(/[:–]/)[0];
  b=b.replace(/\s+(Part\s+(One|Two|Three|Four|\d+)|Chapter\s+\d+|[IVX]{1,4}|\d+)\s*$/i,"");
  return b.trim();
}
function buildFranchiseGroups(list){
  const byBase={};
  list.forEach(item=>{
    const base=franchiseBase(item.name);
    if(!byBase[base])byBase[base]=[];
    byBase[base].push(item);
  });
  const groups=[];
  const singles=[];
  Object.keys(byBase).forEach(base=>{
    if(byBase[base].length>=2){
      const members=byBase[base].slice().sort((a,b)=>(a.year||0)-(b.year||0));
      groups.push({key:base,members});
    }else{
      singles.push(byBase[base][0]);
    }
  });
  return{groups,singles};
}

function getFiltered(){
  let list=[...ITEMS];
  // Apply custom order if exists and no sort/filter active
  if(CUSTOM_ORDER&&SORT==="default"&&F_TYPE==="all"&&F_STATUS==="all"&&F_COUNTRY==="all"&&!SEARCH){
    list.sort((a,b)=>{
      const ai=CUSTOM_ORDER.indexOf(a.id);
      const bi=CUSTOM_ORDER.indexOf(b.id);
      return (ai<0?9999:ai)-(bi<0?9999:bi);
    });
    return list;
  }
  if(SEARCH)list=list.filter(i=>i.name.toLowerCase().includes(SEARCH.toLowerCase()));
  if(F_YEAR)list=list.filter(i=>i.year===F_YEAR);
  if(F_RATING>0)list=list.filter(i=>i.myRating>=F_RATING);
  if(F_TYPE!=="all")list=list.filter(i=>i.type===F_TYPE);
  if(F_STATUS!=="all")list=list.filter(i=>i.status===F_STATUS);
  if(F_COUNTRY!=="all")list=list.filter(i=>i.country===F_COUNTRY);
  if(SORT==="alpha")list.sort((a,b)=>SORT_DIR*a.name.localeCompare(b.name,"ar"));
  else if(SORT==="watched-first")list.sort((a,b)=>SORT_DIR*(a.status==="watched"?-1:1));
  else if(SORT==="unwatched-first")list.sort((a,b)=>SORT_DIR*(a.status==="unwatched"?-1:1));
  else if(SORT==="year-new")list.sort((a,b)=>SORT_DIR*((b.year||0)-(a.year||0)));
  else if(SORT==="year-old")list.sort((a,b)=>SORT_DIR*((a.year||0)-(b.year||0)));
  else if(SORT==="imdb")list.sort((a,b)=>SORT_DIR*((b.imdb||0)-(a.imdb||0)));
  else if(SORT==="recent")list.sort((a,b)=>SORT_DIR*(b.addedAt-a.addedAt));
  else if(SORT==="myrating")list.sort((a,b)=>SORT_DIR*((b.myRating||0)-(a.myRating||0)));
  return list;
}

function getMonthlyStats(){
  const months={};
  const monthNames=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  ITEMS.filter(i=>i.watchedAt).forEach(i=>{
    const d=new Date(i.watchedAt);
    const key=d.getFullYear()+"-"+(d.getMonth()+1);
    const label=monthNames[d.getMonth()]+" "+d.getFullYear();
    if(!months[key])months[key]={label,count:0,key};
    months[key].count++;
  });
  return Object.values(months).sort((a,b)=>a.key.localeCompare(b.key)).slice(-6);
}

  if(!file)return;
  this.value='';
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const MAX=200;
      let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}
      else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const b64=canvas.toDataURL('image/jpeg',0.8);
      if(_imgPickerTarget==='edit')SHOW_EDIT.image=b64;

    };
    img.src=ev.target.result;
  };

});

function mapOmdbCountry(countryStr){
  const first=countryStr.split(",")[0].trim();
  // Prefer a custom country the user already added (e.g. Iraq, Norway, Sweden) if its label matches
  const CUSTOM_SYNONYMS={"Iraq":"العراق","Norway":"النرويج","Sweden":"السويد"};
  if(CUSTOM_SYNONYMS[first]){
    const c=COUNTRIES.find(c=>c.label===CUSTOM_SYNONYMS[first]);
    if(c)return c.code;
  }
  const MAP={
    "United States":"en","USA":"en","United Kingdom":"gb","UK":"gb",
    "South Korea":"ko","Korea":"ko","Japan":"ja","Turkey":"tr","Türkiye":"tr",
    "Spain":"es","France":"fr","Germany":"de","West Germany":"de","Italy":"it",
    "China":"zh","Hong Kong":"zh","Taiwan":"zh","India":"hi","Brazil":"pt","Portugal":"pt",
    "Russia":"ru","Soviet Union":"ru","Iran":"fa",
    "Egypt":"ar","Saudi Arabia":"ar","Lebanon":"ar","Syria":"ar","Jordan":"ar",
    "United Arab Emirates":"ar","Kuwait":"ar","Qatar":"ar","Bahrain":"ar","Oman":"ar",
    "Yemen":"ar","Libya":"ar","Tunisia":"ar","Algeria":"ar","Morocco":"ar","Sudan":"ar","Palestine":"ar"
  };
  return MAP[first]||null;
}
window.fetchItemInfo=async function(target){
  const form=target==="edit"?SHOW_EDIT:ADD_FORM;
  const name=(form.name||"").trim();
  if(!name){showToast("اكتب اسم العمل أول ⚠️","var(--accent-hex)");return;}
  showToast("⏳ جاري البحث...","#f0a500");
  try{
    const r=await fetch(`https://www.omdbapi.com/?apikey=da2431a6&t=${encodeURIComponent(name)}`);
    const d=await r.json();
    if(d.Response==="False"){
      showToast("ما لقيت معلومات لهذا الاسم ⚠️","var(--accent-hex)");
      return;
    }
    const ym=(d.Year||"").match(/\d{4}/);
    if(ym)form.year=parseInt(ym[0]);
    if(d.Type==="series")form.type="series";
    else if(d.Type==="movie")form.type="movie";
    if(d.imdbRating&&d.imdbRating!=="N/A")form.imdb=parseFloat(d.imdbRating);
    if(d.Country&&d.Country!=="N/A"){
      const code=mapOmdbCountry(d.Country);

window.fetchAllPosters=async function(){
  const missing=ITEMS.filter(i=>!i.image);
  if(!missing.length){showToast("كل الأعمال عندها صور ✅","#4caf50");return;}
  showToast("جاري جلب "+missing.length+" صورة... ⏳","#f0a500");
  let done=0,found=0;
  for(const item of missing){
    try{
      const q=encodeURIComponent(item.name);
      const url=`https://www.omdbapi.com/?apikey=da2431a6&t=${q}${item.year?"&y="+item.year:""}`;
      const r=await fetch(url);
      const d=await r.json();
      if(d.Poster&&d.Poster!=="N/A"){
        const idx=ITEMS.findIndex(i=>i.id===item.id);
        if(idx>=0)ITEMS[idx].image=d.Poster;
        found++;
      }
    }catch(e){}
    done++;
    if(done%10===0)showToast(`${done}/${missing.length} ⏳`,"#f0a500");
    await new Promise(r=>setTimeout(r,120));
  }
  saveData();
  renderPage();

window.dragStart=function(id){
  DRAG_ID=id;

window.dragOver=function(e,id){
  e.preventDefault();
  document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('drag-over'));
  const el=document.querySelector(`[data-id="${id}"]`);
  if(el)el.classList.add('drag-over');
}

window.dragDrop=function(targetId){
  if(!DRAG_ID||DRAG_ID===targetId)return;
  // Get current order
  let order=CUSTOM_ORDER?[...CUSTOM_ORDER]:ITEMS.map(i=>i.id);
  const fromIdx=order.indexOf(DRAG_ID);
  const toIdx=order.indexOf(targetId);
  if(fromIdx<0||toIdx<0)return;
  order.splice(fromIdx,1);
  order.splice(toIdx,0,DRAG_ID);
  CUSTOM_ORDER=order;
  saveOrder();
  DRAG_ID=null;
  document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('drag-over','dragging'));
  renderPage();
}

window.dragEnd=function(){
  DRAG_ID=null;
  document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('drag-over','dragging'));
}

window.resetOrder=function(){
  CUSTOM_ORDER=null;
  localStorage.removeItem("wl_order");
  renderPage();
}

// Touch drag support
let _touchDragId=null,_touchOverId=null;
window.touchStart=function(e,id){
  if(!DRAG_MODE)return;
  _touchDragId=id;
  e.target.closest('.item-card').classList.add('dragging');
}
window.touchMove=function(e){
  if(!_touchDragId)return;
  e.preventDefault();
  const touch=e.touches[0];
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  const card=el?.closest('[data-id]');
  if(card){
    const id=parseInt(card.dataset.id);
    if(id!==_touchOverId){
      document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('drag-over'));
      card.classList.add('drag-over');
      _touchOverId=id;
    }
  }
}
window.touchEnd=function(e){
  if(!_touchDragId)return;
  if(_touchOverId&&_touchOverId!==_touchDragId){
    dragDrop(_touchOverId);
  }
  document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('dragging','drag-over'));
  _touchDragId=null;_touchOverId=null;
}

function renderPage(){
  let html="";
  if(PAGE==="home")html=renderHome();
  else if(PAGE==="categories")html=renderCategories();
  else if(PAGE==="stats")html=renderStats();
  else if(PAGE==="random")html=renderRandom();
  else if(PAGE==="guides")html=renderGuides();
  else if(PAGE==="diary")html=renderDiary();
  document.getElementById("app").innerHTML=html+renderAddModal()+renderEditModal()+renderAddCModal()+renderDiaryModal()+renderCloudModal()+renderSettingsModal()+renderTrashModal()+renderNav();
}

// GLOBALS
window.setPage=p=>{PAGE=p;VISIBLE=50;renderPage();}
window.toggleSortDir=function(){SORT_DIR=SORT_DIR===1?-1:1;VISIBLE=50;renderPage();}
window.doSearch=v=>{
  SEARCH=v;VISIBLE=50;
  const cont=document.getElementById("items-container");
  if(cont&&PAGE==="home"){
    const stats=getStats();
    const filtered=getFiltered();
    const visible=filtered.slice(0,VISIBLE);
    const sub=document.getElementById("home-sub");
    if(sub)sub.textContent=ITEMS.length+" عمل · "+stats.watched+" ✅ · "+stats.watching+" ▶️";
    cont.innerHTML=(filtered.length===0?`<div class="empty"><span style="font-size:48px;display:block;margin-bottom:10px">🎬</span>لا توجد نتائج</div>`:"")
      +visible.map((item,_idx)=>{
        const s=gS(item.status),t=gT(item.type),c=gC(item.country);
        return`<div class="item-card${DRAG_MODE?" drag-card":""}" data-id="${item.id}" draggable="${DRAG_MODE}" ondragstart="dragStart(${item.id})" ondragover="dragOver(event,${item.id})" ondrop="dragDrop(${item.id})" ondragend="dragEnd()" ontouchstart="touchStart(event,${item.id})" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">
          <div class="drag-handle">${DRAG_MODE?`<span style="display:block;font-size:17px;line-height:1">⠿</span>`:""}<span style="display:block;background:var(--accent-hex);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;${DRAG_MODE?"margin-top:3px":""}">${_idx+1}</span></div>
          <div class="item-thumb">${item.image?`<img src="${item.image}" alt="" onerror="this.parentElement.innerHTML='🎬'">`:`<span>${t.icon||"🎬"}</span>`}</div>
          <div class="item-info" style="flex:1;min-width:0">
            <div class="item-name">${item.name}</div>
            ${item.progress&&item.status==="watching"?`<div style="font-size:11px;color:#f0a500;margin-bottom:3px">📍 ${item.progress}</div>`:""}
            <div class="item-meta">
              <span class="tag tag-c">${c.flag} ${c.label}</span>
              <span class="tag tag-t">${t.icon} ${t.label}</span>
              ${item.year?`<span class="tag tag-y">${item.year}</span>`:""}
              ${item.imdb?`<span class="imdb-badge">IMDb ${item.imdb}</span>`:""}
              ${item.note?`<span class="tag tag-n">📝 ${item.note}</span>`:""}
            </div>
            ${item.myRating>0?`<div style="font-size:12px;margin-top:2px">${"⭐".repeat(item.myRating)}</div>`:""}
          </div>
          <div class="item-actions" style="flex-shrink:0">
            <button class="status-btn ${item.status}" onclick="cycleStatus(${item.id})">${s.icon}</button>
            <button class="edit-btn" onclick="openDiaryAdd(${item.id})" title="تدوينة">📖</button>
            <button class="edit-btn" onclick="openEdit(${item.id})">✏️</button>
          </div>
        </div>`;
      }).join("")
      +(filtered.length>VISIBLE?`<div class="load-more"><button onclick="loadMore()">📋 عرض المزيد · ${filtered.length-VISIBLE} متبقي</button></div>`:"");
  } else { renderPage(); }
}
window.setFT=v=>{F_TYPE=v;VISIBLE=50;renderPage();}
window.setFS=v=>{F_STATUS=v;VISIBLE=50;renderPage();}
window.setFC=v=>{F_COUNTRY=v;VISIBLE=50;renderPage();}
window.setSort=v=>{SORT=v;VISIBLE=50;renderPage();}
window.setRF=v=>{RAND_FILTER=v;renderPage();}
window.clearFilters=()=>{F_TYPE="all";F_STATUS="all";F_COUNTRY="all";VISIBLE=50;}
window.loadMore=()=>{VISIBLE+=50;renderPage();}
window.cycleStatus=cycleStatus;
window.setMyRating=setMyRating;
window.openAdd=()=>{SHOW_ADD=true;renderPage();}
window.closeAdd=()=>{SHOW_ADD=false;renderPage();}
window.addItem=addItem;
window.openEdit=id=>{
  SHOW_EDIT={...ITEMS.find(i=>i.id===id)};
  // Parse existing progress "الموسم X الحلقة Y"
  if(SHOW_EDIT.progress){
    const ms=SHOW_EDIT.progress.match(/الموسم\s*(\d+)/);
    const me=SHOW_EDIT.progress.match(/الحلقة\s*(\d+)/);
    if(ms)SHOW_EDIT._s=parseInt(ms[1]);
    if(me)SHOW_EDIT._e=parseInt(me[1]);
  }
  if(!SHOW_EDIT._s)SHOW_EDIT._s=1;
  if(!SHOW_EDIT._e)SHOW_EDIT._e=1;
  renderPage();
}
window.closeEdit=()=>{SHOW_EDIT=null;renderPage();}
window.saveEdit=saveEdit;
window.deleteItem=deleteItem;
window.pickMood=function(type){
  let pool=ITEMS.filter(i=>i.status==="unwatched");
  if(type!=="all")pool=pool.filter(i=>i.type===type);
  if(!pool.length){alert("ما في أعمال بهذا النوع!");return;}
  const pick=pool[Math.floor(Math.random()*pool.length)];
  RAND_ITEM=pick;
  renderPage();
}
window.pickRandom=pickRandom;
window.markWatch=id=>{cycleStatus(id);RAND_RESULT=null;renderPage();}
window.openAddC=()=>{SHOW_ADD_C=true;ADD_C_FORM={label:"",flag:"🏳️"};renderPage();}
window.closeAddC=()=>{SHOW_ADD_C=false;renderPage();}
window.addCountry=addCountry;
window.removeCustomCountry=removeCustomCountry;
window.pickFlag=f=>{ADD_C_FORM.flag=f;const el=document.getElementById("cflag");if(el)el.value=f;renderPage();}

// BACKUP
function exportData(){
  const data={items:ITEMS,customCountries:CUSTOM_C,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="watchlist_backup_"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(url);
  showToast("📦 تم تصدير النسخة الاحتياطية!");
}
function importData(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.items&&Array.isArray(data.items)){
          ITEMS=data.items;
          if(data.customCountries){CUSTOM_C=data.customCountries;COUNTRIES=[...DEFAULT_COUNTRIES,...CUSTOM_C];saveCC();}
          saveData();renderPage();
          showToast("✅ تم استيراد "+ITEMS.length+" عمل!");
        }else{showToast("❌ ملف غير صحيح","#e53935");}
      }catch(err){showToast("❌ خطأ في الملف","#e53935");}
    };
    reader.readAsText(file);
  };
  input.click();
}
window.exportData=exportData;
window.importData=importData;

renderPage();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
