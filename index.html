*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}

.dot{position:absolute;bottom:6px;inset-inline-end:6px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(14,15,18,.8)}

.cm{font-size:11.5px;color:var(--mu);margin-top:1px}

.nums{display:flex;justify-content:space-between}.nums div{text-align:center;flex:1}
.nums b{display:block;font-size:24px;font-weight:700}.nums span{font-size:12px;color:var(--mu)}
.bar{height:6px;background:var(--s2);border-radius:6px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}

.top h1{padding:0 0 10px;font-size:22px}
.search{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;outline:0}
.search:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:20px;background:var(--s1);color:var(--mu);font-size:13px;border:1px solid transparent}
.chip.on{background:var(--tx);color:var(--bg);font-weight:600}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center}
.seg{flex:1;display:flex;background:var(--s1);border-radius:10px;padding:3px}

select{background:var(--s1);border:0;border-radius:10px;padding:8px 10px;font-size:12.5px;outline:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:16px 18px}
.count{padding:12px 18px 0;color:var(--mu);font-size:12.5px}
.more{display:block;margin:4px auto 20px;padding:10px 24px;border-radius:20px;background:var(--s1)}
.empty{text-align:center;color:var(--mu);padding:60px 30px}
nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;display:flex;background:rgba(23,24,29,.94);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:10}

.fab{background:var(--ac)!important;color:#0e0f12!important;border-radius:50%;width:46px;height:46px;flex:none!important;padding:0!important;justify-content:center;align-self:center;margin-top:-14px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function webList(q,l,note){sheet(`<h2>🌐 «${E(q.slice(0,40))}»</h2>${l.length?`<div class="lst" style="margin-top:10px">${l.map((r,k)=>`<button class="li" data-x="web_add" data-k="${k}" style="width:100%;text-align:right;gap:10px"><img src="${r.poster_path?"https://image.tmdb.org/t/p/w92"+r.poster_path:""}" style="width:34px;height:50px;border-radius:5px;object-fit:cover;background:var(--s2)" alt=""><span style="flex:1;min-width:0"><b class="ct" style="display:block;font-size:14px;color:var(--tx)">${E(r.title||r.name)}</b><span class="cm">${yr(r)||""} • ${r.media_type==="tv"?"مسلسل":"فيلم"}</span></span></button>`).join("")}</div>`:""}${note?`<div class="sub" style="padding:12px 0">${note}</div>`:l.length?'<div class="sub" style="margin-top:10px">اضغط على العمل ينضاف بكل معلوماته</div>':'<div class="empty">ما لقيت شي، جرّب اسم ثاني أو رابط IMDb</div>'}`)}
async function webSearch(q){q=q.trim();WEBQ=q;sheet(`<h2>🌐 بحث بالإنترنت</h2><div class="empty">جاري البحث...</div>`);
 const fail=e=>sheet(`<h2>🌐 بحث بالإنترنت</h2><div class="empty">فشل البحث: ${E(e.message)}</div>`);
 if(isLink(q)){try{WEBR=await deepSearch(q)}catch(e){return fail(e)}return webList(q,WEBR,"")}
 let a=[];try{a=await mergedSearch(q)}catch(e){if(!srv())return fail(e)}
 if(WEBQ!==q)return;WEBR=a.slice(0,8);webList(q,WEBR,"🔄 يبحث بمصادر ثانية (ويكيبيديا، أنمي...)");
 let b=[];try{b=await extSearch(q)}catch(e){}
 if(WEBQ!==q)return;WEBR=mergeRes(a,b).slice(0,8);webList(q,WEBR,"")}
function smartSheet(){const gs={};items.forEach(i=>(i.gn||[]).forEach(g=>gs[g]=(gs[g]||0)+1));const top=Object.entries(gs).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
 sheet(`<h2>🎯 اختيار ذكي</h2><div class="lbl">الوقت المتاح</div><div class="tabs">${[[0,"أي وقت"],[90,"لحد 90 د"],[120,"لحد ساعتين"],[180,"لحد 3 ساعات"]].map(([k,l])=>`<button class="chip ${SP.m===k?"on":""}" data-x="sp_m" data-k="${k}">${l}</button>`).join("")}</div><div class="lbl">المزاج</div><div class="tabs" style="flex-wrap:wrap"><button class="chip ${SP.g?"":"on"}" data-x="sp_g" data-k="">أي نوع</button>${top.map(g=>`<button class="chip ${SP.g===g?"on":""}" data-x="sp_g" data-k="${E(g)}">${E(g)}</button>`).join("")}</div><div class="lbl">النوع</div><div class="tabs">${[["all","الكل"],...TYPES].map(([k,l])=>`<button class="chip ${SP.t===k?"on":""}" data-x="sp_t" data-k="${k}">${l}</button>`).join("")}</div>${top.length?"":'<div class="sub" style="margin-top:8px">المزاج والوقت يحتاجون جلب الأنواع (المزيد ← جلب الأنواع)</div>'}<button class="btn" data-x="sp_go" style="margin-top:14px">🎲 اختر لي</button><div id="spr"></div>`)}
function spPool(){return items.filter(i=>i.status==="unwatched"&&(SP.t==="all"||i.type===SP.t)&&(!SP.g||(i.gn||[]).includes(SP.g))&&(!SP.m||(i.rt&&i.rt<=SP.m)))}
function ordSheet(){RO=null;ROA=false;sheet(`<h2>↕ ترتيب مخصص</h2><div class="sub" style="margin:6px 0 10px">ابحث عن عمل، اختره، وحركه: فوق، تحت، للنص...</div><input class="in" id="rs_q" placeholder="ابحث عن عمل..."><div id="rs_r" class="lst"></div><div id="rs_p"></div>`)}
function rsFind(v){const q=sn(v.trim()),b=$("#rs_r");if(!b)return;b.innerHTML=q?(items.filter(i=>i.id!==RO&&sn(i.name).includes(q)).slice(0,8).map(i=>`<button class="li" data-x="${ROA?"rs_after":"rs_pick"}" data-k="${i.id}" style="width:100%"><span>${E(i.name)}</span><span class="cm">${i.year||""}</span></button>`).join("")||'<div class="empty">ما كو نتائج</div>'):""}
function rsPanel(){const p=$("#rs_p");if(!p)return;const cur=fullOrd().map(i=>i.id),pos=cur.indexOf(RO),it=items.find(i=>i.id===RO);if(!it){p.innerHTML="";return}
 const b=(k,l)=>`<button class="chip" data-x="rs_m" data-k="${k}">${l}</button>`;
 p.innerHTML=`<div class="gr" style="margin-top:12px">${thumb(it)}<span style="flex:1;min-width:0"><b class="ct" style="display:block">${E(it.name)}</b><span class="cm">المكان ${pos+1} من ${cur.length}</span></span></div><div class="two" style="margin-top:10px">${b("first","⤒ للأول")}${b("last","⤓ للآخر")}</div><div class="two" style="margin-top:8px">${b("up1","▲ خطوة")}${b("dn1","▼ خطوة")}</div><div class="two" style="margin-top:8px">${b("up10","▲▲ 10")}${b("dn10","▼▼ 10")}</div><div class="two" style="margin-top:8px">${b("mid","↔ للنص")}<button class="chip" data-x="rs_aft">📍 بعد عمل...</button></div>`}
function boot(){try{const p=new URLSearchParams(location.search),a=p.get("act"),sh=[p.get("title"),p.get("text"),p.get("url")].filter(Boolean).join(" ").trim();
 if(sh){history.replaceState(null,"",location.pathname);webSearch(sh)}else if(a){history.replaceState(null,"",location.pathname);if(a==="add")addForm(true);else if(a==="pick")smartSheet();else if(a==="lib"){S.tab="lib";render()}}}catch(e){}}
setTimeout(boot,500);
Object.assign(X,{web_q:()=>webSearch(S.q),web_add:k=>{const r=WEBR[k],q0=WEBQ;addForm(true);tmFill(r,r.media_type).then(()=>{if(/[\u0600-\u06FF]/.test(q0)&&!/https?:/.test(q0)&&q0.length<60){AF.name=q0;addForm()}})},
 m_smart:smartSheet,sp_m:k=>{SP.m=+k;smartSheet()},sp_g:k=>{SP.g=k;smartSheet()},sp_t:k=>{SP.t=k;smartSheet()},
 sp_go:()=>{let p=spPool();const b=$("#spr");if(!b)return;if(!p.length){b.innerHTML='<div class="empty">ما كو أعمال بهالمواصفات</div>';return}if(p.length>1)p=p.filter(i=>i!==SP.cur);SP.cur=p[Math.random()*p.length|0];const i=SP.cur;
  b.innerHTML=`<div class="gr" style="margin-top:14px">${thumb(i)}<span style="flex:1;min-width:0"><b class="ct" style="display:block;font-size:15px">${E(i.name)}</b><span class="cm">${[i.year,i.rt?i.rt+" د":"",i.imdb?"★ "+i.imdb:"",(i.gn||[]).slice(0,2).join("، ")].filter(Boolean).join(" • ")}</span></span></div><div class="two" style="margin-top:10px"><button class="chip" data-x="sp_open" data-k="${i.id}">افتح</button><button class="chip" data-x="sp_go">🔄 غيّره</button></div><button class="btn" data-x="sp_watch" data-k="${i.id}" style="margin-top:8px">▶ بدأت أشاهده</button>`},
 sp_open:k=>detail(k),sp_watch:k=>{snap("بدأت المشاهدة");const i=items.find(x=>x.id==k);if(i){i.status="watching";save()}close();render()},
 rs_pick:k=>{RO=+k;ROA=false;rsPanel();rsFind($("#rs_q").value)},
 rs_m:k=>{const cur=fullOrd().map(i=>i.id),p=cur.indexOf(RO);cur.splice(p,1);let q={first:0,last:cur.length,up1:p-1,dn1:p+1,up10:p-10,dn10:p+10,mid:Math.floor((cur.length+1)/2)}[k];q=Math.max(0,Math.min(cur.length,q));cur.splice(q,0,RO);ORDER=cur;put("wl_order",ORDER);scheduleCloudPush();S.sort="custom";rsPanel()},
 rs_aft:()=>{ROA=true;toast("اختر العمل اللي تريد تحطه بعده");const q=$("#rs_q");q.focus();rsFind(q.value)},
 rs_after:k=>{moveSel([RO],"after",+k);ROA=false;rsPanel();rsFind($("#rs_q").value)}});
/* watch-order lists */
let ORDS=[];try{ORDS=JSON.parse(localStorage.getItem("wl_orders")||"[]")}catch(e){}let OCUR=null;
const ordSave=()=>{localStorage.setItem("wl_orders",JSON.stringify(ORDS));try{scheduleCloudPush()}catch(e){}};
const odItems=o=>o.ids.map(id=>items.find(x=>x.id===id)).filter(Boolean);
function ordsSheet(){OCUR=null;sheet(`<h2>📋 قوائم الترتيب</h2><div class="sub" style="margin:4px 0 10px">مثلاً: ترتيب مشاهدة Marvel أو وادي الذئاب</div>${ORDS.length?`<div class="lst">${ORDS.map(o=>{const m=odItems(o),w=m.filter(i=>i.status==="watched").length;return`<button class="li" data-x="od_open" data-k="${o.id}" style="width:100%"><span>${E(o.name)}</span><span class="cm">${w}/${m.length}</span></button>`}).join("")}</div>`:'<div class="empty">ما كو قوائم بعد</div>'}<button class="btn" data-x="od_new" style="margin-top:12px">＋ ترتيب جديد</button>`)}
function odView(id){OCUR=id;const o=ORDS.find(x=>x.id===id);if(!o)return ordsSheet();const m=odItems(o),w=m.filter(i=>i.status==="watched").length,bs='style="padding:4px 7px;font-size:15px"';
 sheet(`<h2>${E(o.name)}</h2><div class="sub">${w}/${m.length} مشاهد</div><div style="height:6px;background:var(--s2);border-radius:6px;margin:8px 0 12px"><div style="height:100%;width:${m.length?w/m.length*100:0}%;background:#4cc38a;border-radius:6px"></div></div>${m.map((i,n)=>`<div class="gr">${thumb(i)}<span style="flex:1;min-width:0"><b class="ct" style="display:block;font-size:14px">${n+1}. ${E(i.name)}</b><span class="cm">${i.year||""}</span></span><button data-x="od_st" data-k="${i.id}" ${bs}>${SI[i.status]}</button><button data-x="od_up" data-k="${i.id}" ${bs}>▲</button><button data-x="od_dn" data-k="${i.id}" ${bs}>▼</button><button data-x="od_to" data-k="${i.id}" ${bs}>#</button><button data-x="od_rm" data-k="${i.id}" style="padding:4px 7px;font-size:15px;color:#ff7a7a">✕</button></div>`).join("")||'<div class="empty">القائمة فارغة، أضف أعمال</div>'}<div class="two" style="margin-top:12px"><button class="chip" data-x="od_add">＋ أضف عمل</button><button class="chip" data-x="od_next">⏭ التالي</button></div><div class="two" style="margin-top:8px"><button class="chip" data-x="od_ren">✏️ تسمية</button><button class="chip" data-x="od_del" style="color:#ff7a7a">🗑️ حذف القائمة</button></div><button class="btn" data-x="od_back" style="margin-top:8px;background:var(--s2);color:var(--tx)">رجوع</button>`)}
function odFind(v){const o=ORDS.find(x=>x.id===OCUR),q=sn(v.trim()),b=$("#od_r");if(!o||!b)return;b.innerHTML=q?(items.filter(i=>!o.ids.includes(i.id)&&sn(i.name).includes(q)).slice(0,8).map(i=>`<button class="li" data-x="od_pick" data-k="${i.id}" style="width:100%"><span>${E(i.name)}</span><span class="cm">${i.year||""}</span></button>`).join("")||'<div class="empty">ما كو نتائج</div>'):""}
function odMove(id,to){const o=ORDS.find(x=>x.id===OCUR);if(!o)return;const p=o.ids.indexOf(id);if(p<0)return;o.ids.splice(p,1);o.ids.splice(Math.max(0,Math.min(o.ids.length,to)),0,id);ordSave();odView(OCUR)}
Object.assign(X,{m_ords:ordsSheet,od_open:k=>odView(+k),od_back:ordsSheet,
 od_new:()=>{const n=(prompt("اسم الترتيب (مثلاً: ترتيب مشاهدة Marvel)")||"").trim();if(!n)return;const o={id:Date.now(),name:n,ids:[]};ORDS.push(o);ordSave();odView(o.id)},
 od_ren:()=>{const o=ORDS.find(x=>x.id===OCUR),n=(prompt("الاسم الجديد",o.name)||"").trim();if(n){o.name=n;ordSave();odView(OCUR)}},
 od_del:()=>{if(!confirm("حذف هذي القائمة؟ (الأعمال نفسها تبقى بمكتبتك)"))return;ORDS=ORDS.filter(x=>x.id!==OCUR);ordSave();ordsSheet()},
 od_add:()=>{sheet(`<h2>＋ أضف للترتيب</h2><input class="in" id="od_q" placeholder="ابحث عن عمل من مكتبتك..."><div id="od_r" class="lst"></div><button class="btn" data-x="od_done" style="margin-top:10px">تم</button>`);const q=$("#od_q");if(q)q.focus()},
 od_pick:k=>{const o=ORDS.find(x=>x.id===OCUR);if(!o)return;o.ids.push(+k);ordSave();toast("انضاف بالآخر (رقم "+o.ids.length+")");odFind($("#od_q").value)},od_done:()=>odView(OCUR),
 od_st:k=>{snap("تغيّرت الحالة");const i=items.find(x=>x.id==k);i.status={unwatched:"watching",watching:"watched",watched:"unwatched",dropped:"unwatched"}[i.status];if(i.status==="watched"&&!i.watchedAt)i.watchedAt=Date.now();save();odView(OCUR)},
 od_up:k=>{const o=ORDS.find(x=>x.id===OCUR);odMove(+k,o.ids.indexOf(+k)-1)},od_dn:k=>{const o=ORDS.find(x=>x.id===OCUR);odMove(+k,o.ids.indexOf(+k)+1)},
 od_to:k=>{const o=ORDS.find(x=>x.id===OCUR),n=parseInt(prompt("رقم المكان الجديد (1 إلى "+o.ids.length+")"));if(n>=1)odMove(+k,n-1)},
 od_rm:k=>{const o=ORDS.find(x=>x.id===OCUR);o.ids=o.ids.filter(x=>x!==+k);ordSave();odView(OCUR)},
 od_next:()=>{const o=ORDS.find(x=>x.id===OCUR),n=odItems(o).find(i=>i.status==="watching"||i.status==="unwatched");n?detail(n.id):toast("خلصت كل القائمة 🎉")}});
/* reorder the More menu */
let MEDIT=false,MKEYS=[];
function moreSort(arr){let o=[];try{o=JSON.parse(localStorage.getItem("wl_more_order")||"[]")}catch(e){}const ix=k=>{const n=o.indexOf(k);return n<0?1e6+arr.findIndex(a=>a[0]===k):n};const r=[...arr].sort((a,b)=>ix(a[0])-ix(b[0]));MKEYS=r.map(a=>a[0]);return r}
Object.assign(X,{mo_edit:()=>{MEDIT=!MEDIT;more()},mo_m:v=>{const[k,op]=v.split("|"),a=MKEYS.slice(),p=a.indexOf(k);a.splice(p,1);let q={first:0,up:p-1,dn:p+1,mid:Math.floor((a.length+1)/2)}[op];q=Math.max(0,Math.min(a.length,q));a.splice(q,0,k);localStorage.setItem("wl_more_order",JSON.stringify(a));more()}});
/* deep clean */
const s2re=/(^|[\s(\[])S\d{1,2}([\s)\]]|$)/i;
function cleanSheet(){const dg=dupGroups().length,s2=items.filter(i=>s2re.test(i.name)).length,im=items.filter(i=>i.image).length;
 sheet(`<h2>🧼 تنظيف شامل</h2><div class="lst" style="margin:12px 0"><div class="li"><span>مجموعات مكررة</span><span class="cm">${dg}</span></div><div class="li"><span>أعمال بعلامة S2/S3...</span><span class="cm">${s2}</span></div><div class="li"><span>أعمال بغلاف</span><span class="cm">${im}</span></div></div><div class="sub" style="line-height:1.8">الخطوات: ١) ينزل ملف نسخة أمان ٢) يدمج المكررات (يبقى الأكمل) ٣) ينقل أعمال S2 لسلة المحذوفات ٤) يحذف كل الأغلفة ويصفّر التحقق ٥) مطابقة شاملة: تبحث بالعربي والإنجليزي والتركي مع السنة والنوع وتجيب المعلومات والغلاف الصحيح. الأسماء ما تتغير، واللي ما تتأكد منه يروح للمراجعة. تحتاج السيرفر مفعّل وتبقي الشاشة شغالة.</div><button class="btn" data-x="cl_run" style="margin-top:12px">▶ نفّذ الكل</button><button class="chip" data-x="cl_undo" style="margin-top:8px;width:100%">↩ تراجع (لحد أول تعديل ثاني)</button>`)}
Object.assign(X,{m_clean:cleanSheet,cl_undo:()=>X.undo(),
 cl_run:async()=>{if(!srv())return toast("فعّل السيرفر أول (المزيد ← السيرفر والمزامنة)، لأن التنظيف يمسح الأغلفة ويرجعها من الإنترنت");if(!confirm("تنفيذ التنظيف الشامل؟ ينزل نسخة أمان أول، وتقدر تتراجع."))return;UNDO={i:JSON.stringify(items),t:JSON.stringify(TRASH)};try{exportData()}catch(e){}
  window._bulk=1;dupGroups().forEach(g=>{const l=g.filter(x=>items.includes(x));if(l.length<2)return;const k=l.slice().sort((a,b)=>score(b)-score(a))[0];mergeKeep(k.id,l.map(x=>x.id))});
  items.filter(i=>s2re.test(i.name)).forEach(i=>toTrash(i.id));window._bulk=0;
  items.forEach(i=>{i.image="";delete i.chk});REV=[];save();chkSheet();runVerify()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-x]");if(t&&X[t.dataset.x])X[t.dataset.x](t.dataset.k)});
document.addEventListener("input",e=>{if(e.target.id==="d_q")dOpts(e.target.value)});
render();setTimeout(()=>{if(!srv())toast("فعّل السيرفر من المزيد ← السيرفر والمزامنة")},1500);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
