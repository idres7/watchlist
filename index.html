body{background:#0a0a0f;color:#f0f0f0;font-family:'Cairo',sans-serif;direction:rtl;min-height:100vh;background-image:radial-gradient(ellipse at 20% 20%,#1a0a2e 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,#0a1a2e 0%,transparent 50%);}
::-webkit-scrollbar{width:0;height:0;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:75px;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,13,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);display:flex;z-index:100;}
.nav-btn{flex:1;padding:10px 0;background:none;border:none;color:#555;cursor:pointer;font-family:'Cairo',sans-serif;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;}

.nav-btn .icon{font-size:20px;}
.header{padding:14px 14px 8px;background:rgba(13,13,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:50;}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.page-title{font-size:20px;font-weight:900;color:#e84d4d;}

.search-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;color:#f0f0f0;font-family:'Cairo',sans-serif;font-size:14px;direction:rtl;outline:none;margin-bottom:7px;backdrop-filter:blur(10px);transition:border .2s;}
.search-input:focus{border-color:rgba(232,77,77,0.5);}
.search-input::placeholder{color:#444;}
.chips{display:flex;gap:5px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none;}
.chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:4px 11px;font-size:12px;color:#888;cursor:pointer;white-space:nowrap;font-family:'Cairo',sans-serif;flex-shrink:0;transition:all .2s;}
.chip.red.active{background:rgba(232,77,77,0.15);border-color:#e84d4d;color:#e84d4d;}
.chip.green.active{background:rgba(76,175,80,0.15);border-color:#4caf50;color:#4caf50;}
.chip.orange.active{background:rgba(232,168,56,0.15);border-color:#e8a838;color:#e8a838;}
.chip.purple.active{background:rgba(136,85,255,0.15);border-color:#8855ff;color:#8855ff;}
.chip.blue.active{background:rgba(74,158,255,0.15);border-color:#4a9eff;color:#4a9eff;}
.add-btn{background:linear-gradient(135deg,#e84d4d,#c0392b);color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 4px 15px rgba(232,77,77,0.3);}
.item-card{background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);border-radius:14px;padding:11px 13px;margin:6px 12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,0.07);transition:border-color .2s,transform .1s;}
.item-card:active{transform:scale(0.99);}
.item-num{color:#333;font-size:11px;min-width:22px;text-align:center;}
.item-info{flex:1;min-width:0;}
.item-name{font-weight:700;font-size:14px;word-break:break-word;line-height:1.3;}
.item-meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;align-items:center;}
.tag{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;}
.tag-c{background:rgba(136,85,255,0.15);color:#aa77ff;}
.tag-t{background:rgba(232,168,56,0.15);color:#e8a838;}
.tag-n{background:rgba(74,158,255,0.15);color:#4a9eff;}
.tag-y{background:rgba(76,175,80,0.08);color:#666;font-size:10px;}
.tag-r{background:rgba(232,77,77,0.15);color:#e84d4d;font-size:11px;}
.item-actions{display:flex;flex-direction:column;gap:5px;align-items:center;}
.status-btn{width:38px;height:38px;border-radius:50%;border:2px solid;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.status-btn:active{transform:scale(0.9);}
.status-btn.unwatched{background:rgba(232,168,56,0.15);border-color:#e8a838;}
.status-btn.watching{background:rgba(74,158,255,0.15);border-color:#4a9eff;}

.edit-btn{background:rgba(255,255,255,0.05);border:none;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:11px;color:#666;}

@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-weight:900;font-size:17px;margin-bottom:4px;}
.modal-sub{font-size:12px;color:#555;margin-bottom:14px;}

let ADD_C_FORM={label:"",flag:"🏳️"};
let VISIBLE=50;

function gC(code){return COUNTRIES.find(c=>c.code===code)||{code:"other",label:"أخرى",flag:"🌍"};}
function gT(code){return TYPES.find(t=>t.code===code)||TYPES[0];}
function gS(code){return STATUSES.find(s=>s.code===code)||STATUSES[0];}

function showToast(msg,color="#4caf50"){
  const t=document.createElement("div");
  t.className="toast";t.textContent=msg;t.style.background=color;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}

function getFiltered(){
  let list=[...ITEMS];
  if(SEARCH)list=list.filter(i=>i.name.toLowerCase().includes(SEARCH.toLowerCase()));
  if(F_TYPE!=="all")list=list.filter(i=>i.type===F_TYPE);
  if(F_STATUS!=="all")list=list.filter(i=>i.status===F_STATUS);
  if(F_COUNTRY!=="all")list=list.filter(i=>i.country===F_COUNTRY);
  if(SORT==="alpha")list.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  else if(SORT==="watched-first")list.sort((a,b)=>a.status==="watched"?-1:1);
  else if(SORT==="unwatched-first")list.sort((a,b)=>a.status==="unwatched"?-1:1);
  else if(SORT==="year-new")list.sort((a,b)=>(b.year||0)-(a.year||0));
  else if(SORT==="year-old")list.sort((a,b)=>(a.year||0)-(b.year||0));
  else if(SORT==="imdb")list.sort((a,b)=>(b.imdb||0)-(a.imdb||0));
  else if(SORT==="recent")list.sort((a,b)=>b.addedAt-a.addedAt);
  else if(SORT==="myrating")list.sort((a,b)=>(b.myRating||0)-(a.myRating||0));
  return list;
}

function getStats(){
  const total=ITEMS.length,watched=ITEMS.filter(i=>i.status==="watched").length,watching=ITEMS.filter(i=>i.status==="watching").length;
  const pct=total?Math.round(watched/total*100):0;
  const byType=TYPES.map(t=>({...t,total:ITEMS.filter(i=>i.type===t.code).length,watched:ITEMS.filter(i=>i.type===t.code&&i.status==="watched").length}));
  const byCountry=COUNTRIES.map(c=>({...c,total:ITEMS.filter(i=>i.country===c.code).length,watched:ITEMS.filter(i=>i.country===c.code&&i.status==="watched").length})).filter(c=>c.total>0);
  return{total,watched,watching,pct,byType,byCountry};
}

function chips(opts,cur,fn,cls){
  return opts.map(o=>`<button class="chip ${cls} ${o.v===cur?"active":""}" onclick="${fn}('${o.v}')">${o.l}</button>`).join("");
}

function starsHTML(rating,itemId){
  let h="";
  for(let i=1;i<=5;i++)h+=`<span class="star ${i<=rating?"on":""}" onclick="setMyRating(${itemId},${i})">⭐</span>`;
  return h;
}

// ACTIONS
function cycleStatus(id){
  const order=["unwatched","watching","watched"];
  const item=ITEMS.find(i=>i.id===id);if(!item)return;
  item.status=order[(order.indexOf(item.status)+1)%order.length];
  saveData();renderPage();
}
function setMyRating(id,r){
  const item=ITEMS.find(i=>i.id===id);if(!item)return;
  item.myRating=item.myRating===r?0:r;
  saveData();renderPage();
}
function addItem(){
  if(!ADD_FORM.name.trim())return;
  const newId=Math.max(...ITEMS.map(i=>i.id),0)+1;
  ITEMS.push({id:newId,name:ADD_FORM.name.trim(),type:ADD_FORM.type,country:ADD_FORM.country,
    status:"unwatched",note:ADD_FORM.note.trim(),year:parseInt(ADD_FORM.year)||null,
    imdb:parseFloat(ADD_FORM.imdb)||null,myRating:0,addedAt:Date.now()});
  ADD_FORM={name:"",type:"movie",country:"en",note:"",year:"",imdb:""};
  SHOW_ADD=false;saveData();renderPage();showToast("✅ تمت الإضافة!");
}
function saveEdit(){
  if(!SHOW_EDIT)return;
  const idx=ITEMS.findIndex(i=>i.id===SHOW_EDIT.id);
  if(idx>=0)ITEMS[idx]={...SHOW_EDIT};
  SHOW_EDIT=null;saveData();renderPage();showToast("✏️ تم التعديل","#4a9eff");
}
function deleteItem(id){
  ITEMS=ITEMS.filter(i=>i.id!==id);
  SHOW_EDIT=null;saveData();renderPage();showToast("🗑️ تم الحذف","#e53935");
}
function pickRandom(){
  let pool=ITEMS.filter(i=>i.status==="unwatched");
  if(RAND_FILTER!=="all")pool=pool.filter(i=>i.type===RAND_FILTER);
  RAND_RESULT=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  renderPage();
}
function addCountry(){
  const label=ADD_C_FORM.label.trim();if(!label)return;
  const flag=ADD_C_FORM.flag.trim()||"🏳️";
  const code="c_"+Date.now();
  CUSTOM_C.push({code,label,flag});
  COUNTRIES=[...DEFAULT_COUNTRIES,...CUSTOM_C];
  saveCC();ADD_C_FORM={label:"",flag:"🏳️"};SHOW_ADD_C=false;
  renderPage();showToast("🌍 تمت إضافة البلد!");
}
function removeCustomCountry(code){
  CUSTOM_C=CUSTOM_C.filter(c=>c.code!==code);
  COUNTRIES=[...DEFAULT_COUNTRIES,...CUSTOM_C];
  saveCC();renderPage();showToast("🗑️ تم الحذف","#e53935");
}

// RENDER
function renderNav(){
  const tabs=[{k:"stats",i:"📊",l:"إحصائيات"},{k:"random",i:"🎲",l:"عشوائي"},{k:"categories",i:"📁",l:"التصنيفات"},{k:"home",i:"🏠",l:"الرئيسية"}];
  return`<nav class="nav">${tabs.map(t=>`<button class="nav-btn ${PAGE===t.k?"active":""}" onclick="setPage('${t.k}')"><span class="icon">${t.i}</span><span>${t.l}</span></button>`).join("")}</nav>`;
}

    {v:"year-old",l:"📅 الأقدم"},

  <div class="backup-bar">
    <button class="btn-backup" onclick="exportData()">📦 تصدير نسخة احتياطية</button>
    <button class="btn-backup" onclick="importData()">📥 استيراد</button>
  </div>
  <div class="header">
    <div class="header-row">
      <div><div class="page-title">🎬 قائمتي</div><div class="page-sub">${ITEMS.length} عمل · ${stats.watched} ✅ · ${stats.watching} ▶️</div></div>
      <button class="add-btn" onclick="openAdd()">+ إضافة</button>
    </div>
    <input class="search-input" placeholder="🔍 ابحث عن أي عمل..." value="${SEARCH.replace(/"/g,'&quot;')}" oninput="doSearch(this.value)">
    <div class="chips">${chips(sOpts,F_STATUS,"setFS","green")}</div>
    <div class="chips">${chips(tOpts,F_TYPE,"setFT","red")}</div>
    <div class="chips">
      ${chips(cOpts,F_COUNTRY,"setFC","purple")}
      <button class="chip purple active" onclick="openAddC()" style="background:#8855ff22;border-color:#8855ff;color:#aa77ff">➕ بلد</button>
    </div>
    <div class="chips">${chips(sortOpts,SORT,"setSort","orange")}</div>
  </div>
  <div style="padding:4px 0">
    ${filtered.length===0?`<div class="empty"><span style="font-size:48px;display:block;margin-bottom:10px">🎬</span>لا توجد نتائج</div>`:""}
    ${visible.map(item=>{
      const s=gS(item.status),t=gT(item.type),c=gC(item.country);
      return`<div class="item-card">
        <div class="item-num">${item.id}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-meta">
            <span class="tag tag-c">${c.flag} ${c.label}</span>
            <span class="tag tag-t">${t.icon} ${t.label}</span>
            ${item.year?`<span class="tag tag-y">${item.year}</span>`:""}
            ${item.imdb?`<span class="imdb-badge">IMDb ${item.imdb}</span>`:""}
            ${item.note?`<span class="tag tag-n">📝 ${item.note}</span>`:""}
          </div>
          ${item.myRating>0?`<div style="font-size:13px;margin-top:3px">${"⭐".repeat(item.myRating)}</div>`:""}
        </div>
        <div class="item-actions">
          <button class="status-btn ${item.status}" onclick="cycleStatus(${item.id})">${s.icon}</button>

  <div class="header"><div class="page-title">📊 الإحصائيات</div><div class="page-sub">تقدمك في المشاهدة</div></div>
  <div style="padding:12px">
    <div class="big-pct">
      <div class="pct-num">${s.pct}%</div>
      <div style="color:#666;font-size:13px;margin-top:4px">نسبة الإنجاز الكلية</div>

      <div class="stat-card"><div class="stat-val" style="color:#4a9eff">${s.watching}</div><div class="stat-lbl">جاري ▶️</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#4caf50">${s.watched}</div><div class="stat-lbl">شاهدت ✅</div></div>

      <div class="stat-card"><div class="stat-val" style="color:#e84d4d">${ITEMS.filter(i=>i.myRating>0).length}</div><div class="stat-lbl">قيّمت ⭐</div></div>
    </div>
    <div class="sec-lbl">التقدم حسب النوع</div>
    ${s.byType.filter(t=>t.total>0).map(t=>`
      <div class="prog-row">
        <div class="prog-lbl"><span>${t.icon} ${t.label}</span><span style="color:#e84d4d">${t.total?Math.round(t.watched/t.total*100):0}% · ${t.watched}/${t.total}</span></div>

    ${topImdb.map(i=>`
      <div style="display:flex;justify-content:space-between;align-items:center;background:#14141c;border-radius:8px;padding:8px 11px;margin-bottom:5px;border:1px solid #1e1e2a">
        <span style="font-size:13px;font-weight:700">${i.name}</span>
        <span class="imdb-badge">IMDb ${i.imdb}</span>
      </div>`).join("")}

      </div>
      <button class="btn-p" onclick="addCountry()">✅ إضافة البلد</button>
      <button class="btn-s" onclick="closeAddC()">إلغاء</button>
      ${CUSTOM_C.length>0?`
        <div style="margin-top:10px;border-top:1px solid #2a2a38;padding-top:10px">
          <div style="font-size:12px;color:#666;margin-bottom:7px">البلدان المضافة:</div>
          ${CUSTOM_C.map(c=>`<div class="cc-item">
            <span>${c.flag} ${c.label}</span>
            <button onclick="removeCustomCountry('${c.code}')" style="background:#e5393522;border:none;color:#e53935;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px;font-family:inherit">حذف</button>
          </div>`).join("")}
        </div>`:""}
    </div>
  </div>`;
}

function renderPage(){
  let html="";
  if(PAGE==="home")html=renderHome();
  else if(PAGE==="categories")html=renderCategories();
  else if(PAGE==="stats")html=renderStats();
  else if(PAGE==="random")html=renderRandom();
  document.getElementById("app").innerHTML=html+renderAddModal()+renderEditModal()+renderAddCModal()+renderNav();
}

// GLOBALS
window.setPage=p=>{PAGE=p;VISIBLE=50;renderPage();}
window.doSearch=v=>{SEARCH=v;VISIBLE=50;renderPage();}
window.setFT=v=>{F_TYPE=v;VISIBLE=50;renderPage();}
window.setFS=v=>{F_STATUS=v;VISIBLE=50;renderPage();}
window.setFC=v=>{F_COUNTRY=v;VISIBLE=50;renderPage();}
window.setSort=v=>{SORT=v;VISIBLE=50;renderPage();}
window.setRF=v=>{RAND_FILTER=v;renderPage();}
window.clearFilters=()=>{F_TYPE="all";F_STATUS="all";F_COUNTRY="all";VISIBLE=50;}
window.loadMore=()=>{VISIBLE+=50;renderPage();}
window.cycleStatus=cycleStatus;
window.setMyRating=setMyRating;
window.openAdd=()=>{SHOW_ADD=true;renderPage();}
window.closeAdd=()=>{SHOW_ADD=false;renderPage();}
window.addItem=addItem;
window.openEdit=id=>{SHOW_EDIT={...ITEMS.find(i=>i.id===id)};renderPage();}
window.closeEdit=()=>{SHOW_EDIT=null;renderPage();}
window.saveEdit=saveEdit;
window.deleteItem=deleteItem;
window.pickRandom=pickRandom;
window.markWatch=id=>{cycleStatus(id);RAND_RESULT=null;renderPage();}
window.openAddC=()=>{SHOW_ADD_C=true;ADD_C_FORM={label:"",flag:"🏳️"};renderPage();}
window.closeAddC=()=>{SHOW_ADD_C=false;renderPage();}
window.addCountry=addCountry;
window.removeCustomCountry=removeCustomCountry;
window.pickFlag=f=>{ADD_C_FORM.flag=f;const el=document.getElementById("cflag");if(el)el.value=f;renderPage();}

// BACKUP
function exportData(){
  const data={items:ITEMS,customCountries:CUSTOM_C,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="watchlist_backup_"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(url);
  showToast("📦 تم تصدير النسخة الاحتياطية!");
}
function importData(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.items&&Array.isArray(data.items)){
          ITEMS=data.items;
          if(data.customCountries){CUSTOM_C=data.customCountries;COUNTRIES=[...DEFAULT_COUNTRIES,...CUSTOM_C];saveCC();}
          saveData();renderPage();
          showToast("✅ تم استيراد "+ITEMS.length+" عمل!");
        }else{showToast("❌ ملف غير صحيح","#e53935");}
      }catch(err){showToast("❌ خطأ في الملف","#e53935");}
    };
    reader.readAsText(file);
  };
  input.click();
}
window.exportData=exportData;
window.importData=importData;

renderPage();
</script>
