<script>

/* web search, links, smart pick, order screen */
let WEBR=[],WEBQ="",SP={t:"all",m:0,g:"",cur:null},RO=null,ROA=false;
const jget=async u=>{try{const r=await fetch(u,{signal:AbortSignal.timeout?AbortSignal.timeout(4500):undefined});return r.ok?await r.json():null}catch(e){return null}};
async function fromText(txt){txt=(txt||"").trim();let m;
 if(m=txt.match(/themoviedb\.org\/(movie|tv)\/(\d+)/)){const d=await tm(`/${m[1]}/${m[2]}?language=ar`);return{...d,media_type:m[1]}}
 if(m=txt.match(/\btt\d{7,10}/)){const d=await tm("/find/"+m[0]+"?external_source=imdb_id&language=ar");if((d.movie_results||[])[0])return{...d.movie_results[0],media_type:"movie"};if((d.tv_results||[])[0])return{...d.tv_results[0],media_type:"tv"}}
 if(m=txt.match(/myanimelist\.net\/anime\/(\d+)/)){const j=await jget("https://api.jikan.moe/v4/anime/"+m[1]);if(j&&j.data)return{title:j.data.title_english||j.data.title}}
 if(m=txt.match(/wikipedia\.org\/wiki\/([^?#\s]+)/))return{title:decodeURIComponent(m[1]).replace(/_/g," ")};
 return null}
async function extTitles(q){const o=new Set(),en=encodeURIComponent(q);
 const[w,j,v]=await Promise.all([jget("https://ar.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+en+"&gsrlimit=2&prop=langlinks&lllang=en&format=json&origin=*"),jget("https://api.jikan.moe/v4/anime?limit=3&q="+en),jget("https://api.tvmaze.com/search/shows?q="+en)]);
 Object.values((w&&w.query&&w.query.pages)||{}).forEach(p=>{const l=(p.langlinks||[])[0];if(l)o.add(l["*"])});
 (Array.isArray(j&&j.data)?j.data:[]).slice(0,2).forEach(a=>o.add(a.title_english||a.title));(Array.isArray(v)?v:[]).slice(0,2).forEach(x=>x.show&&o.add(x.show.name));
 o.delete(q);return[...o].filter(Boolean).slice(0,4)}
const XC=new Map(),mergeRes=(a,b)=>{const o=[...a];b.forEach(v=>{if(!o.find(y=>y.id===v.id&&y.media_type===v.media_type))o.push(v)});return o};
async function extSearch(q){if(XC.has(q))return XC.get(q);const r=[];await Promise.all((await extTitles(q)).slice(0,2).map(async x=>{try{(await mergedSearch(x)).forEach(v=>r.push(v))}catch(e){}}));XC.set(q,r);return r}
const isLink=q=>/https?:\/\/|\btt\d{7}/.test(q);
async function deepSearch(q){q=q.trim();if(isLink(q)){const r=await fromText(q);if(r&&r.id)return[r];if(r&&r.title)q=r.title}
 const[a,b]=await Promise.all([mergedSearch(q).catch(e=>{if(!srv())throw e;return[]}),extSearch(q).catch(()=>[])]);return mergeRes(a,b)}
function webList(q,l,note,il){sheet(`<h2>🌐 «${E(q.slice(0,40))}»</h2>${l.length?`<div class="lst" style="margin-top:10px">${l.map((r,k)=>`<button class="li" data-x="web_add" data-k="${k}" style="width:100%;text-align:right;gap:10px"><img src="${r.poster_path?"https://image.tmdb.org/t/p/w92"+r.poster_path:""}" style="width:34px;height:50px;border-radius:5px;object-fit:cover;background:var(--s2)" alt=""><span style="flex:1;min-width:0"><b class="ct" style="display:block;font-size:14px;color:var(--tx)">${E(r.title||r.name)}</b><span class="cm">${yr(r)||""} • ${r.media_type==="tv"?"مسلسل":"فيلم"}</span></span></button>`).join("")}</div>`:""}${imdbGroup(il)}${note?`<div class="sub" style="padding:12px 0">${note}</div>`:l.length?'<div class="sub" style="margin-top:10px">اضغط على العمل ينضاف بكل معلوماته</div>':'<div class="empty">ما لقيت شي، جرّب اسم ثاني أو رابط IMDb</div>'}`)}
async function webSearch(q){q=q.trim();WEBQ=q;sheet(`<h2>🌐 بحث بالإنترنت</h2><div class="empty">جاري البحث...</div>`);
 const fail=e=>sheet(`<h2>🌐 بحث بالإنترنت</h2><div class="empty">فشل البحث: ${E(e.message)}</div>`);
 if(isLink(q)){try{WEBR=await deepSearch(q)}catch(e){return fail(e)}return webList(q,WEBR,"")}
 let a=[];try{a=await mergedSearch(q)}catch(e){if(!srv())return fail(e)}
 if(WEBQ!==q)return;WEBR=a.slice(0,8);webList(q,WEBR,"🔄 يبحث بمصادر ثانية (ويكيبيديا، أنمي...)");
 let b=[];try{b=await extSearch(q)}catch(e){}
 if(WEBQ!==q)return;WEBR=mergeRes(a,b).slice(0,8);let il=[];try{il=await imdbCands(q)}catch(e){}if(WEBQ!==q)return;WEBI=il.filter(x=>!WEBR.some(r=>sn(r.title||r.name)===sn(x.Title)&&yr(r)===+String(x.Year).slice(0,4)));webList(q,WEBR,"",WEBI)}

 sheet(`<h2>🎯 اختيار ذكي</h2><div class="lbl">الوقت المتاح</div><div class="tabs">${[[0,"أي وقت"],[90,"لحد 90 د"],[120,"لحد ساعتين"],[180,"لحد 3 ساعات"]].map(([k,l])=>`<button class="chip ${SP.m===k?"on":""}" data-x="sp_m" data-k="${k}">${l}</button>`).join("")}</div><div class="lbl">المزاج</div><div class="tabs" style="flex-wrap:wrap"><button class="chip ${SP.g?"":"on"}" data-x="sp_g" data-k="">أي نوع</button>${top.map(g=>`<button class="chip ${SP.g===g?"on":""}" data-x="sp_g" data-k="${E(g)}">${E(g)}</button>`).join("")}</div><div class="lbl">النوع</div><div class="tabs">${[["all","الكل"],...TYPES].map(([k,l])=>`<button class="chip ${SP.t===k?"on":""}" data-x="sp_t" data-k="${k}">${l}</button>`).join("")}</div>${top.length?"":'<div class="sub" style="margin-top:8px">المزاج والوقت يحتاجون جلب الأنواع (المزيد ← جلب الأنواع)</div>'}<button class="btn" data-x="sp_go" style="margin-top:14px">🎲 اختر لي</button><div id="spr"></div>`)}

function ordSheet(){RO=null;ROA=false;sheet(`<h2>↕ ترتيب مخصص</h2><div class="sub" style="margin:6px 0 10px">ابحث عن عمل، اختره، وحركه: فوق، تحت، للنص...</div><input class="in" id="rs_q" placeholder="ابحث عن عمل..."><div id="rs_r" class="lst"></div><div id="rs_p"></div>`)}
function rsFind(v){const q=sn(v.trim()),b=$("#rs_r");if(!b)return;b.innerHTML=q?(items.filter(i=>i.id!==RO&&sn(i.name).includes(q)).slice(0,8).map(i=>`<button class="li" data-x="${ROA?"rs_after":"rs_pick"}" data-k="${i.id}" style="width:100%"><span>${E(i.name)}</span><span class="cm">${i.year||""}</span></button>`).join("")||'<div class="empty">ما كو نتائج</div>'):""}
function rsPanel(){const p=$("#rs_p");if(!p)return;const cur=fullOrd().map(i=>i.id),pos=cur.indexOf(RO),it=items.find(i=>i.id===RO);if(!it){p.innerHTML="";return}
 const b=(k,l)=>`<button class="chip" data-x="rs_m" data-k="${k}">${l}</button>`;
 p.innerHTML=`<div class="gr" style="margin-top:12px">${thumb(it)}<span style="flex:1;min-width:0"><b class="ct" style="display:block">${E(it.name)}</b><span class="cm">المكان ${pos+1} من ${cur.length}</span></span></div><div class="two" style="margin-top:10px">${b("first","⤒ للأول")}${b("last","⤓ للآخر")}</div><div class="two" style="margin-top:8px">${b("up1","▲ خطوة")}${b("dn1","▼ خطوة")}</div><div class="two" style="margin-top:8px">${b("up10","▲▲ 10")}${b("dn10","▼▼ 10")}</div><div class="two" style="margin-top:8px">${b("mid","↔ للنص")}<button class="chip" data-x="rs_aft">📍 بعد عمل...</button></div>`}
function boot(){try{const p=new URLSearchParams(location.search),a=p.get("act"),sh=[p.get("title"),p.get("text"),p.get("url")].filter(Boolean).join(" ").trim();
 if(sh){history.replaceState(null,"",location.pathname);webSearch(sh)}else if(a){history.replaceState(null,"",location.pathname);if(a==="add")addForm(true);else if(a==="pick")smartSheet();else if(a==="lib"){S.tab="lib";render()}}}catch(e){}}
setTimeout(boot,500);
Object.assign(X,{web_q:()=>webSearch(S.q),web_add:k=>{const r=WEBR[k],q0=WEBQ;addForm(true);tmFill(r,r.media_type).then(()=>{if(/[\u0600-\u06FF]/.test(q0)&&!/https?:/.test(q0)&&q0.length<60){AF.name=q0;addForm()}})},
 m_smart:smartSheet,sp_m:k=>{SP.m=+k;smartSheet()},sp_g:k=>{SP.g=k;smartSheet()},sp_t:k=>{SP.t=k;smartSheet()},
 sp_go:()=>{let p=spPool();const b=$("#spr");if(!b)return;if(!p.length){b.innerHTML='<div class="empty">ما كو أعمال بهالمواصفات</div>';return}if(p.length>1)p=p.filter(i=>i!==SP.cur);SP.cur=p[Math.random()*p.length|0];const i=SP.cur;
  b.innerHTML=`<div class="gr" style="margin-top:14px">${thumb(i)}<span style="flex:1;min-width:0"><b class="ct" style="display:block;font-size:15px">${E(i.name)}</b><span class="cm">${[i.year,i.rt?i.rt+" د":"",i.imdb?"★ "+i.imdb:"",(i.gn||[]).slice(0,2).join("، ")].filter(Boolean).join(" • ")}</span></span></div><div class="two" style="margin-top:10px"><button class="chip" data-x="sp_open" data-k="${i.id}">افتح</button><button class="chip" data-x="sp_go">🔄 غيّره</button></div><button class="btn" data-x="sp_watch" data-k="${i.id}" style="margin-top:8px">▶ بدأت أشاهده</button>`},

<script>

<script>

/* cover auditor: multi-source candidates, audit, auto-fill, visual review */
const TMI="https://image.tmdb.org/t/p/w342",tp=u=>(typeof u==="string"&&u.startsWith(TMI))?u.slice(TMI.length):"";
const cvT=s=>(s||"").replace(/\(.*?\)|^File:|\.\w+$/g,"").trim();
async function srcId(i){if(!i.tm)return[];try{const d=await tm(`/${i.tm.mt}/${i.tm.id}/images?include_image_language=ar,en,null`);return(d.posters||[]).slice(0,6).map(p=>({u:TMI+p.file_path,s:"TMDB"}))}catch(e){return[]}}
async function srcSearch(q){try{return(await mergedSearch(q)).filter(r=>r.poster_path).slice(0,5).map(r=>({u:TMI+r.poster_path,s:"TMDB • "+(r.title||r.name)+" "+(yr(r)||"")}))}catch(e){return[]}}
async function srcOmdb(i){if(!i.tm)return[];try{const iid=i.iid||(await tm(`/${i.tm.mt}/${i.tm.id}/external_ids`)).imdb_id;if(!iid)return[];const o=await(await srvFetch("/omdb?i="+iid)).json();return o.Poster&&o.Poster!=="N/A"?[{u:o.Poster,s:"IMDb"}]:[]}catch(e){return[]}}
async function srcWiki(q,y){const o=[];for(const l of["ar","en"]){const j=await jget(`https://${l}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q+(y?" "+y:"")+(l==="en"?" film":""))}&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*`);Object.values((j&&j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).forEach(p=>{if(p.thumbnail)o.push({u:p.thumbnail.source,s:"ويكيبيديا "+l+" • "+p.title,ti:p.title})})}return o}
async function srcCommons(q,y){const j=await jget(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q+(y?" "+y:"")+" poster")}&gsrlimit=4&prop=imageinfo&iiprop=url&iiurlwidth=450&format=json&origin=*`);return Object.values((j&&j.query&&j.query.pages)||{}).map(p=>({u:(p.imageinfo||[{}])[0].thumburl,s:"Commons • "+p.title.replace(/^File:/,""),ti:p.title})).filter(x=>x.u)}
async function srcTv(q){const j=await jget("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(q));return(Array.isArray(j)?j:[]).slice(0,3).filter(x=>x.show&&x.show.image).map(x=>({u:x.show.image.original||x.show.image.medium,s:"TVMaze • "+x.show.name,ti:x.show.name}))}
async function srcJikan(q){const j=await jget("https://api.jikan.moe/v4/anime?limit=3&q="+encodeURIComponent(q));return(Array.isArray(j&&j.data)?j.data:[]).filter(a=>a.images&&a.images.jpg).map(a=>({u:a.images.jpg.large_image_url,s:"Jikan • "+(a.title_english||a.title),ti:a.title_english||a.title}))}
async function cvCands(i,q){const ns=q?[q]:[i.name,...(i.an||[]).slice(0,2)],y=q?"":i.year;
 const all=await Promise.all([q?[]:srcId(i),...ns.map(srcSearch),q?[]:srcOmdb(i),...ns.slice(0,2).map(n=>srcWiki(n,y)),srcCommons(ns[0],y),srcTv(ns[0]),(i.type==="anime"||i.type==="cartoon")?srcJikan(ns[0]):[]].map(p=>Promise.resolve(p).catch(()=>[])));
 const seen=new Set(),o=[];all.flat().forEach(c=>{if(c.u&&!seen.has(c.u)){seen.add(c.u);o.push(c)}});return o.slice(0,16)}
async function cvAuto(i){
 if(i.tm){const c=await srcId(i);if(c.length){i.image=c[0].u;return"tmdb"}}
 else{try{const m=await bestMatch(i);if(m.r&&m.s>=.8&&m.r._ns>=.6){await applyTo(i,m.r,m.r.media_type,true);if(i.image)return"match"}}catch(e){}}
 const ns=[i.name,...(i.an||[]).slice(0,2)];
 for(const n of ns){const w=[...(await srcWiki(n,i.year)),...(await srcCommons(n,i.year))];const h=w.find(c=>cvT(c.ti)&&sim(n,cvT(c.ti))>=.75);if(h){i.image=h.u;i.cf="غلاف من الويب، تأكد منه";return"web"}}
 if(i.type!=="movie")for(const n of ns){const h=(await srcTv(n)).find(c=>sim(n,c.ti)>=.85);if(h){i.image=h.u;i.cf="غلاف من TVMaze، تأكد منه";return"tvmaze"}}
 return null}
let CVN=0,CVLEFT=0;const CVCAP=60,CVSEEN={};
const cvMore=()=>CVLEFT>0?" • باقي "+CVLEFT+"، اضغط مرة ثانية":"";
async function cvPool(l,fn,title){const sn=CVSEEN[title]||(CVSEEN[title]={});let pend=l.filter(i=>!sn[i.id]);if(!pend.length&&l.length){CVSEEN[title]={};pend=[...l]}const q0=CVSEEN[title]||sn;const q=pend.slice(0,CVCAP);q.forEach(i=>{(CVSEEN[title]||sn)[i.id]=1});CVN=q.length;CVLEFT=pend.length-q.length;const n0=q.length;let n=0,er=0;sheet(`<h2>${title}</h2><div class="sub" id="cvp">0/${n0}</div>`);
 const run=async()=>{while(q.length&&er<8){const i=q.shift();try{await fn(i)}catch(e){er++}n++;const c=$("#cvp");if(c&&n%4===0)c.textContent=n+"/"+n0}};await Promise.all([run(),run(),run(),run()]);save();return er}
async function cvAudit(){if(!srv())return toast("فعّل السيرفر أول (المزيد ← السيرفر والمزامنة)");const l=items.filter(i=>i.image&&!i.cv);if(!l.length)return toast("ما كو أغلفة للفحص");let bad=0;
 const er=await cvPool(l,async i=>{let why="";const p=tp(i.image);if(!i.tm)why="العمل غير مربوط بـTMDB";else if(!p)why="غلاف من مصدر ثاني أو من المعرض";else{const d=await tm(`/${i.tm.mt}/${i.tm.id}?language=en-US`);if(d.poster_path!==p){const im=await tm(`/${i.tm.mt}/${i.tm.id}/images?include_image_language=ar,en,null`);if(!(im.posters||[]).some(x=>x.file_path===p))why="الغلاف مو من صور هذا العمل بـTMDB"}}if(why){i.cf=why;bad++}else delete i.cf},"🔎 فحص الأغلفة");
 close();toast(er>=8?"توقف بسبب أخطاء اتصال":`تم الفحص: ${bad} غلاف مشكوك فيه`+cvMore());cvSheet()}
async function cvFill(){if(!srv())return toast("فعّل السيرفر أول (المزيد ← السيرفر والمزامنة)");const l=items.filter(i=>!i.image&&!i.cv);if(!l.length)return toast("كل الأعمال عندها أغلفة");let got=0;
 const er=await cvPool(l,async i=>{if(await cvAuto(i))got++},"➕ جلب الأغلفة الناقصة");close();toast(er>=8?"توقف بسبب أخطاء اتصال":`انضاف غلاف لـ${got} من ${CVN} عمل`+cvMore());cvSheet()}
let RVL=[],RVK=0,RVC=[];
function cvSheet(){const no=items.filter(i=>!i.image&&!i.cv).length,fl=items.filter(i=>i.image&&i.cf&&!i.cv).length,ok=items.filter(i=>i.cv).length;
 sheet(`<h2>🖼️ مدقق الأغلفة</h2><div class="lst" style="margin:10px 0"><div class="li"><span>بدون غلاف</span><span class="cm">${no}</span></div><div class="li"><span>غلاف مشكوك فيه</span><span class="cm">${fl}</span></div><div class="li"><span>أكدتها يدوياً</span><span class="cm">${ok}</span></div></div><div class="sub" style="line-height:1.8">١) فحص: يقارن غلاف كل عمل بصور TMDB الرسمية لنفس العمل ٢) إكمال: يجيب الناقص من TMDB، ثم ويكيبيديا وCommons (للأعمال القديمة) وTVMaze وJikan ٣) مراجعة: تشوف كل غلاف بعينك وتختار الصحيح من اقتراحات من كل المصادر.</div><button class="btn" data-x="cv_audit" style="margin-top:10px">🔎 فحص الأغلفة</button><button class="btn" data-x="cv_fill" style="margin-top:8px;background:var(--s2);color:var(--tx)">➕ جلب الأغلفة الناقصة</button><button class="btn" data-x="cv_rev" style="margin-top:8px;background:var(--s2);color:var(--tx)">👁️ مراجعة بصرية (${no+fl})</button>`)}
function cvList(){return items.filter(i=>(!i.image||i.cf)&&!i.cv).sort((a,b)=>(!!a.image)-(!!b.image)).map(i=>i.id)}
function cvShow(){if(RVK<0)RVK=0;if(!RVL.length||RVK>=RVL.length){close();return toast("خلصت المراجعة 🎉")}const i=items.find(x=>x.id===RVL[RVK]);if(!i){RVK++;return cvShow()}
 sheet(`<h2>🖼️ مراجعة الأغلفة (${RVK+1}/${RVL.length})</h2><div class="gr">${i.image?`<img src="${E(i.image)}" style="width:96px;height:144px;border-radius:8px;object-fit:cover;flex:none" alt="">`:'<div style="width:96px;height:144px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex:none" class="cm">لا يوجد</div>'}<span style="flex:1;min-width:0"><b class="ct" style="display:block;font-size:15px;white-space:normal">${E(i.name)}</b><span class="cm" style="white-space:normal">${E([i.year,TL[i.type],i.cf].filter(Boolean).join(" • "))}</span></span></div><div class="two" style="margin:10px 0"><button class="chip" data-x="cv_ok">✅ الحالي صحيح</button><button class="chip" data-x="cv_del">🚫 بدون غلاف</button></div><div class="lbl">اقتراحات (اضغط للاختيار)</div><div id="cv_c" style="display:flex;gap:8px;overflow-x:auto;min-height:150px"><div class="cm">جاري البحث...</div></div><input class="in" id="cv_q" placeholder="ابحث باسم ثاني (إنجليزي مثلاً)" style="margin-top:10px"><div class="two" style="margin-top:8px"><button class="chip" data-x="cv_find">🔍 ابحث</button><button class="chip" data-x="cv_skip">⏭ تخطي</button></div><button class="chip" data-x="cv_prev" style="width:100%;margin-top:8px">⏮ السابق</button>`);cvLoad(i,"")}
async function cvLoad(i,q){const c=await cvCands(i,q);if(RVL[RVK]!==i.id)return;RVC=c;const b=$("#cv_c");if(b)b.innerHTML=c.length?c.map((x,n)=>`<button data-x="cv_pick" data-k="${n}" style="flex:none;width:84px;padding:0;background:none;text-align:center"><img loading="lazy" src="${E(x.u)}" style="width:84px;height:126px;object-fit:cover;border-radius:8px;background:var(--s2)" alt=""><div class="cm" style="font-size:10px;white-space:normal;line-height:1.3">${E(x.s.slice(0,30))}</div></button>`).join(""):'<div class="cm">ما لقيت اقتراحات، جرّب اسم ثاني</div>'}
const cvNext=()=>{save();RVK++;cvShow()},cvCur=()=>items.find(x=>x.id===RVL[RVK]);
Object.assign(X,{m_cv:cvSheet,cv_audit:cvAudit,cv_fill:cvFill,cv_rev:()=>{RVL=cvList();RVK=0;cvShow()},cv_one:k=>{RVL=[+k];RVK=0;cvShow()},
 cv_ok:()=>{const i=cvCur();if(i){i.cv=1;delete i.cf}cvNext()},cv_del:()=>{const i=cvCur();if(i){i.image="";i.cv=1;delete i.cf}cvNext()},
 cv_pick:k=>{const i=cvCur(),c=RVC[+k];if(i&&c){i.image=c.u;i.cv=1;delete i.cf}cvNext()},cv_skip:()=>{RVK++;cvShow()},cv_prev:()=>{RVK=Math.max(0,RVK-1);cvShow()},
 cv_find:()=>{const i=cvCur(),q=(($("#cv_q")||{}).value||"").trim();if(!i||!q)return;const b=$("#cv_c");if(b)b.innerHTML='<div class="cm">جاري البحث...</div>';cvLoad(i,q)}});

<script>

async function addFromTm(r,mt,typed){const f=await tmData(r,mt);if(!f.tm||!f.tm.id)throw new Error("TMDB");if(items.some(x=>x.tm&&x.tm.id===f.tm.id&&x.tm.mt===f.tm.mt))return null;const it={id:Math.max(0,...items.map(i=>i.id))+1,name:typed&&/[\u0600-\u06FF]/.test(typed)?typed:f.name,type:f.type,country:f.country,status:"unwatched",note:"",year:f.year,imdb:f.imdb,myRating:0,addedAt:Date.now(),image:f.image,tr:f.tr,tv:f.tv,iid:f.iid||"",tm:f.tm,progress:"",watchedAt:null,chk:1};items.push(it);save();return it}

function tgSheet(){sheet(`<h2>🤖 بوت تلكرام</h2><div class="sub" style="line-height:1.9;margin:6px 0 12px">١) افتح @BotFather بتلكرام واكتب /newbot وخذ المفتاح.<br>٢) بكلاودفلير: Settings ← Variables and Secrets ← Add ← Secret باسم <b>TG_TOKEN</b> والصق المفتاح، وDeploy.<br>٣) اضغط تفعيل الربط تحت، واتبع الرمز اللي يطلع.<br>بعدها تبعث للبوت اسم فيلم أو رابط فيضيفه، و/pick يرشح لك، و/backup نسخة احتياطية.</div><button class="btn" data-x="tg_setup">🔗 تفعيل الربط</button><div id="tg_r"></div><button class="chip" data-x="tg_backup" style="width:100%;margin-top:8px">📦 ارسل نسخة احتياطية هسه لتلكرام</button>`)}

async function blMatch(row){let c=[];try{c=await mergedSearch(row.name)}catch(e){}if(!c.length){try{c=await extSearch(row.name)}catch(e){}}const sc=c.map(r=>({r,...scoreM({name:row.name,year:row.y,type:null},r)})).sort((a,b)=>b.s-a.s).slice(0,3);row.c=sc;row.sel=sc.length&&sc[0].s>=.8&&sc[0].ns>=.6?0:-1}
function bulkSheet(){sheet(`<h2>📋 إضافة قائمة أسماء</h2><div class="sub" style="line-height:1.7;margin:4px 0 8px">الصق أسماء الأعمال، اسم بكل سطر (السنة اختيارية بين قوسين). يلقاها ويربطها تلقائياً، واللي مو متأكد منه تختاره بنفسك.</div><textarea class="in" id="bl_t" rows="8" placeholder="Inception (2010)&#10;مرحبا دولة&#10;Dark" style="width:100%"></textarea><button class="btn" data-x="bl_go" style="margin-top:10px">🔎 دوّر عليهم</button><div id="bl_r"></div>`)}

 PPL=(dir?(cc.crew||[]).filter(x=>x.job==="Director"):(cc.cast||[])).filter(x=>(x.media_type==="movie"||x.media_type==="tv")&&!seen.has(x.media_type+x.id)&&seen.add(x.media_type+x.id)).sort((a,b)=>(b.vote_count||0)-(a.vote_count||0)).slice(0,40);
